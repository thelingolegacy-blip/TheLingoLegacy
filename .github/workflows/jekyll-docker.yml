name: Lingo Legacy Static CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Static validation and artifact upload require no repository or Actions write token.
permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test static gate orchestrator
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup-node.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-run-static-gates.mjs 2>&1 | tee static-gate-orchestrator-tests.log

      - name: Run complete static gate stack
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup-node.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-static-gates.mjs
          node scripts/run-static-gates.mjs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-static-ci-evidence
          path: |
            static-gate-results.json
            static-gate-*.log
          if-no-files-found: warn
