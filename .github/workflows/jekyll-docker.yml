name: Lingo Legacy Static CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

env:
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Runner diagnostics
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_temp=${RUNNER_TEMP}"
          uname -a

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs 2>&1 | tee sanitize.log

      - name: Verify Cloudflare binding contract
        run: node scripts/verify-cloudflare-bindings.mjs 2>&1 | tee bindings.log

      - name: Validate release-critical static site
        run: node scripts/validate-static-site.mjs 2>&1 | tee validator.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-static-ci-evidence
          path: |
            sanitize.log
            bindings.log
            validator.log
          if-no-files-found: warn

# Evidence-trigger commit: force a fresh PR verification run.
