name: Lingo Legacy Static CI

on:
  push:
    branches: [ "main", "staged/universe-experience-integration-2026-09-04" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Runner execution telemetry
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          echo "runner.environment=${RUNNER_ENVIRONMENT}"
          echo "github.run_id=${GITHUB_RUN_ID}"
          echo "github.run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "github.sha=${GITHUB_SHA}"
          test -n "${RUNNER_NAME}"
          test -n "${GITHUB_RUN_ID}"
          test -n "${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs 2>&1 | tee sanitize.log

      - name: Verify Cloudflare binding contract
        run: node scripts/verify-cloudflare-bindings.mjs 2>&1 | tee bindings.log

      - name: Validate release-critical static site
        run: node scripts/validate-static-site.mjs 2>&1 | tee validator.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-static-ci-evidence
          path: |
            sanitize.log
            bindings.log
            validator.log
          if-no-files-found: warn
