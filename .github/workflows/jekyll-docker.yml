name: Lingo Legacy Static CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize retired provider surface
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sanitize-cloudflare-only-surface.mjs 2>&1 | tee sanitize.log

      - name: Verify Cloudflare binding contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-bindings.mjs 2>&1 | tee bindings.log

      - name: Validate release-critical static site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-static-site.mjs 2>&1 | tee validator.log

      - name: Write CI execution metadata
        if: always()
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
          GH_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          node -e '
            const fs=require("node:fs");
            const out={workflow:"Lingo Legacy Static CI",runId:process.env.GH_RUN_ID,runAttempt:process.env.GH_RUN_ATTEMPT,commitSha:process.env.GH_SHA,ref:process.env.GH_REF,event:process.env.GH_EVENT,job:process.env.GH_JOB,generatedAt:new Date().toISOString()};
            fs.writeFileSync("ci-run-metadata.json",JSON.stringify(out,null,2)+"\n");
          '

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-static-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sanitize.log
            bindings.log
            validator.log
            ci-run-metadata.json
          if-no-files-found: warn
