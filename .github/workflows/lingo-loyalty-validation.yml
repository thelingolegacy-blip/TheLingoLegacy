name: LINGOloyalty Staging Validation

on:
  pull_request:
    paths:
      - "lingo-loyalty/**"
      - ".github/workflows/lingo-loyalty-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run policy tests
        working-directory: lingo-loyalty
        run: npm test
      - name: Validate SQL migration
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("lingo-loyalty/migrations/0001_ledger.sql").read_text())
          names = {row[0] for row in db.execute("SELECT name FROM sqlite_master")}
          required = {"loyalty_wallets", "loyalty_ledger", "coupon_redemptions", "loyalty_wallet_balances"}
          assert required.issubset(names), required - names
          print("SQLite migration syntax and required objects: PASS")
          PY
