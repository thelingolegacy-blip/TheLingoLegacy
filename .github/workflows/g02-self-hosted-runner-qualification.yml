name: G02 Self-Hosted Runner Qualification

run-name: G02 qualification — ${{ inputs.incident_ref }} — ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      incident_ref:
        description: "Incident or qualification reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g02-runner-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify G02 runner, tests, and dry-run build
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 20
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture runner identity and verify GitHub job assignment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --version | tee evidence/node-version.txt
          npm --version | tee evidence/npm-version.txt
          printf '%s\\n' "$REPOSITORY" > evidence/repository.txt
          printf '%s\\n' "$COMMIT_SHA" > evidence/commit-sha.txt
          printf '%s\\n' "$RUN_ID" > evidence/run-id.txt
          printf '%s\\n' "$RUN_ATTEMPT" > evidence/run-attempt.txt
          printf '%s\\n' "$INCIDENT_REF" > evidence/incident-ref.txt
          printf '%s\\n' "$RUNNER_NAME" > evidence/runner-name.txt
          printf '%s\\n' "$RUNNER_OS" > evidence/runner-os.txt
          printf '%s\\n' "$RUNNER_ARCH" > evidence/runner-arch.txt
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          curl --fail --silent --show-error \\
            -H "Accept: application/vnd.github+json" \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \\
            -o evidence/jobs-api.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('evidence/jobs-api.json', 'utf8'));
          const jobs = (p.jobs ?? []).filter(j =>
            j.name === 'Verify G02 runner, tests, and dry-run build' &&
            j.runner_name === process.env.RUNNER_NAME &&
            Number.isSafeInteger(j.id) && j.id > 0 &&
            Number.isSafeInteger(j.runner_id) && j.runner_id > 0
          );
          if (jobs.length !== 1) {
            console.error('FAIL: could not uniquely verify numeric GitHub job and runner IDs.');
            process.exit(2);
          }
          fs.writeFileSync('evidence/runner-assignment.json', JSON.stringify({
            run_id: process.env.RUN_ID,
            run_attempt: process.env.RUN_ATTEMPT,
            repository: process.env.REPOSITORY,
            commit_sha: process.env.COMMIT_SHA,
            job_id: jobs[0].id,
            runner_id: jobs[0].runner_id,
            runner_name: jobs[0].runner_name,
            runner_os: process.env.RUNNER_OS,
            runner_arch: process.env.RUNNER_ARCH,
            captured_at_utc: new Date().toISOString()
          }, null, 2) + '\\n');
          NODE
          test -s evidence/runner-assignment.json

      - name: Run project contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-api-endpoint-contract.mjs scripts/test-verify-dynamic-runtime.mjs scripts/test-worker-http-contract.mjs 2>&1 | tee evidence/node-test.log

      - name: Run runtime source verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-dynamic-runtime.mjs 2>&1 | tee evidence/runtime-verifier.log

      - name: Build Worker without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/lingo-g02-qualification-build --config wrangler.jsonc 2>&1 | tee evidence/wrangler-dry-run.log
          test -s /tmp/lingo-g02-qualification-build/worker.js
          echo "dry_run_build=PASS" > evidence/build-result.txt

      - name: Record final summary and evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "commit_sha=${{ github.sha }}"
            echo "job_status=${{ job.status }}"
            echo "captured_at_utc=$(date -u +%FT%TZ)"
          } > evidence/run-summary.txt
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/SHA256SUMS.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-runner-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
