name: G02 Runner Diagnostics
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/g02-runner-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: g02-runner-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hosted-runner:
    name: Hosted runner qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record workflow and runner metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          uname -a
          python3 --version
          git --version
      - uses: actions/checkout@v4
      - name: Verify repository checkout
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          git rev-parse --show-toplevel
          git rev-parse HEAD
          echo "Hosted runner qualification passed."
  self-hosted-runner:
    name: G02 self-hosted runner qualification
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Record runner identity and required labels
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
      - uses: actions/checkout@v4
      - name: Verify self-hosted checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --show-toplevel
          git rev-parse HEAD
          echo "G02 self-hosted runner qualification passed."
