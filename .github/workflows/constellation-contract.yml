name: Constellation OS Contract

on:
  workflow_dispatch:
  push:
    branches:
      - studio/constellation-os-2026-09-20

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runner gate
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS_VALUE" = "Linux"
          test -n "$GITHUB_SHA_VALUE"
          echo "RUNNER_GATE=PASS"
      - name: Constellation contract gate
        run: node scripts/verify-constellation-contract.mjs
