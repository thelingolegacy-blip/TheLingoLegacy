name: Constellation OS Contract

on:
  workflow_dispatch:
  push:
    branches:
      - studio/constellation-os-2026-09-20

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runner gate
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
          RUNNER_WORKSPACE_VALUE: ${{ runner.workspace }}
          TOOL_CACHE_VALUE: ${{ runner.tool_cache }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS_VALUE" = "Linux"
          test -n "$RUNNER_ARCH_VALUE"
          test -n "$RUNNER_TEMP_VALUE"
          test -n "$RUNNER_WORKSPACE_VALUE"
          test -n "$TOOL_CACHE_VALUE"
          test -n "$GITHUB_SHA_VALUE"
          echo "RUNNER_GATE=PASS"

      - name: Read-only evidence evaluator tests
        run: node --test tests/evaluate-runner-evidence.test.mjs tests/six-layer-evidence.test.mjs

      - name: Constellation contract gate
        id: verifier
        shell: bash
        env:
          CONSTELLATION_VERIFIER_INVOKED: "true"
        run: |
          set -euo pipefail
          node scripts/verify-constellation-contract.mjs | tee verifier.log
          echo "VERIFIER_GATE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture runtime evidence
        if: always()
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_TEMP: ${{ runner.temp }}
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_JOB: ${{ github.job }}
          CONSTELLATION_VERIFIER_OUTCOME: ${{ steps.verifier.outcome }}
          CONSTELLATION_LOGS_AVAILABLE: "true"
          CONSTELLATION_VERIFIER_INVOKED: "true"
          CONSTELLATION_VERIFIER_EXIT_CODE: ${{ steps.verifier.outcome == 'success' && '0' || '1' }}
          CONSTELLATION_VERIFIER_GATE: ${{ steps.verifier.outcome == 'success' && 'PASS' || 'FAIL' }}
          CONSTELLATION_WORKFLOW_STATUS: "in_progress"
        run: |
          set +e
          node scripts/collect-runner-evidence.mjs constellation-evidence.json
          test -s constellation-evidence.json
          echo "Evidence bundle captured."
          exit 0

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constellation-evidence-${{ github.run_id }}
          path: constellation-evidence.json
          if-no-files-found: error
