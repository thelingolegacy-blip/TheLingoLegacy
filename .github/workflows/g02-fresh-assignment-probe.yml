name: G02 Fresh Assignment Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assignment-probe:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Prove runner assignment
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_ASSIGNMENT_PROBE=START"
          echo "runner_id=${{ runner.id }}"
          echo "runner_name=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          test -n "${{ runner.id }}"
          test "${{ runner.id }}" != "0"
          test "${{ runner.name }}" = "lingo-legacy-g02"
          echo "G02_ASSIGNMENT_PROBE=PASS"
