name: G02 Fresh Assignment Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  assignment-probe:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Prove runner assignment
        id: assignment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_ID: ${{ github.job }}
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_NAME_CONTEXT: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          echo "G02_ASSIGNMENT_PROBE=START"
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNER_NAME_CONTEXT" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"

          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"

          ASSIGNMENT="$(printf '%s' "$JOBS_JSON" | node -e '
            let data = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(data);
              const matches = (payload.jobs || []).filter(job => job.name === process.env.JOB_ID);
              if (matches.length !== 1) process.exit(2);
              const job = matches[0];
              if (!Number.isInteger(job.runner_id) || job.runner_id <= 0) process.exit(3);
              if (job.runner_name !== "lingo-legacy-g02") process.exit(4);
              process.stdout.write(JSON.stringify({runner_id: job.runner_id, runner_name: job.runner_name, job_id: job.id, status: job.status}));
            });
          ')"
          RUNNER_ID="$(printf '%s' "$ASSIGNMENT" | node -e '
            let s=""; process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => process.stdout.write(String(JSON.parse(s).runner_id)));
          ')"
          RUNNER_NAME_API="$(printf '%s' "$ASSIGNMENT" | node -e '
            let s=""; process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(s).runner_name));
          ')"
          [[ "$RUNNER_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RUNNER_NAME_API" = "lingo-legacy-g02"
          printf 'run_id=%s\nrun_number=%s\nsource_sha=%s\nrunner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$RUN_ID" "$RUN_NUMBER" "$SOURCE_SHA" "$RUNNER_ID" "$RUNNER_NAME_API" "$RUNNER_OS_VALUE" "$RUNNER_ARCH_VALUE"
          echo "G02_RUNNER_IDENTITY=PASS"
          echo "G02_ASSIGNMENT_PROBE=PASS"
