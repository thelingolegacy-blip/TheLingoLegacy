name: G02 Fresh Assignment Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assignment-probe:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Prove runner assignment
        id: assignment
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "G02_ASSIGNMENT_PROBE=START"
          printf 'run_id=%s\nrun_number=%s\nsource_sha=%s\nrunner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$RUN_ID" "$RUN_NUMBER" "$SOURCE_SHA" "$RUNNER_ID" "$RUNNER_NAME" "$RUNNER_OS_VALUE" "$RUNNER_ARCH_VALUE"
          [[ "$RUNNER_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          echo "G02_RUNNER_IDENTITY=PASS"
          echo "G02_ASSIGNMENT_PROBE=PASS"
