name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [infra/self-hosted-runner-v1]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Runner identity sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          printf 'RUNNER_EXECUTION_SENTINEL=PASS\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\n'             "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT"

      - name: Host diagnostics
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          git --version
          df -h /
          free -h || true
