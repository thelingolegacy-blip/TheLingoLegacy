name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [infra/self-hosted-runner-v1]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Runner identity sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"

          JOBS_JSON="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          RUNNER_ID="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .runner_id' | head -n1)"
          API_RUNNER_NAME="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .runner_name' | head -n1)"

          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "null"
          test "$RUNNER_ID" -gt 0
          test -n "$API_RUNNER_NAME"
          test "$API_RUNNER_NAME" != "null"
          test "$API_RUNNER_NAME" = "$RUNNER_NAME"

          printf 'RUNNER_EXECUTION_SENTINEL=PASS\nrunner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\ngithub_run_id=%s\n'             "$RUNNER_ID" "$API_RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT" "$GITHUB_RUN_ID"

      - name: Host diagnostics
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          git --version
          df -h /
          free -h || true
