name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [infra/g02-runner-recovery-clean-2026-10-09]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Runner identity and execution sentinel
        id: sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "G02_FORENSIC_EXIT_STATUS=%s\\n" "$rc"; exit "$rc"' EXIT

          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          test -n "$GITHUB_RUN_ID"
          test -n "$GITHUB_SHA_VALUE"

          JOBS_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          JOB_ID="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .id' | head -n1)"
          RUNNER_ID="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .runner_id' | head -n1)"
          API_RUNNER_NAME="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .runner_name' | head -n1)"
          API_HEAD_SHA="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-sentinel") | .head_sha' | head -n1)"

          test -n "$JOB_ID"
          test "$JOB_ID" != "null"
          test "$JOB_ID" -gt 0
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "null"
          test "$RUNNER_ID" -gt 0
          test "$API_RUNNER_NAME" = "$RUNNER_NAME"
          test "$API_HEAD_SHA" = "$GITHUB_SHA_VALUE"

          mkdir -p g02-evidence
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_id "$JOB_ID" \
            --arg commit_sha "$GITHUB_SHA_VALUE" \
            --arg runner_id "$RUNNER_ID" \
            --arg runner_name "$API_RUNNER_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            '{
              evidence_type: "G02_EXECUTION_SENTINEL",
              execution: "ACTUAL",
              artifact_upload: "PENDING",
              correlated: true,
              independently_verified: false,
              formally_accepted: false,
              github_run_id: $run_id,
              github_job_id: $job_id,
              github_commit_sha: $commit_sha,
              runner_id: ($runner_id | tonumber),
              runner_name: $runner_name,
              runner_os: $runner_os,
              runner_arch: $runner_arch,
              runner_environment: $runner_environment
            }' > g02-evidence/g02-sentinel.json

          printf 'RUNNER_EXECUTION_SENTINEL=PASS\nrunner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\ngithub_run_id=%s\ngithub_job_id=%s\ngithub_commit_sha=%s\n' \
            "$RUNNER_ID" "$API_RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT" "$GITHUB_RUN_ID" "$JOB_ID" "$GITHUB_SHA_VALUE"

      - name: Host diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "hostname=$(hostname)"
            uname -a
            git --version
            df -h /
            free -h || true
          } | tee g02-evidence/host-diagnostics.txt

      - name: Upload G02 execution evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-execution-evidence-${{ github.run_id }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 7
