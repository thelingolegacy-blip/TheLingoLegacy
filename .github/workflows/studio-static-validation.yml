name: Studio Static Validation
on:
  pull_request:
    paths:
      - "studio-sites/**"
      - "worker.js"
      - "scripts/verify-studio-world-api.mjs"
      - "scripts/verify-asklingo-contract.mjs"
      - "scripts/verify-platform-surface-contract.mjs"
      - "scripts/verify-release-acceptance.mjs"
      - "scripts/test-verify-release-acceptance.mjs"
      - "release/acceptance-gates.json"
      - "platforms/**"
      - "cloudflare/lingo-flagship-root.js"
      - "cloudflare/wrangler.flagship-root.jsonc"
      - "scripts/verify-flagship-root-contract.mjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "pwa-register.js"
      - ".github/workflows/studio-static-validation.yml"
  push:
    branches:
      - "studio/lingoarcade-lingoslots-enterprise-2026-10-11"
    paths:
      - "studio-sites/**"
      - ".github/workflows/studio-static-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-static-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate studio design baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate studio configuration and local assets
        run: node studio-sites/scripts/validate-studio.mjs
      - name: Validate studio world matrix and game engine
        run: node studio-sites/scripts/validate-world-matrix.mjs
      - name: Validate Cloudflare studio world API contract
        run: node scripts/verify-studio-world-api.mjs
      - name: Test Worker rate limits and askLINGO readiness
        run: node --test scripts/tests/worker-rate-limit.test.mjs
      - name: Validate askLINGO assistant contract
        run: node scripts/verify-asklingo-contract.mjs
      - name: Validate multi-platform surface contract
        run: node scripts/verify-platform-surface-contract.mjs
      - name: Validate fail-closed release acceptance registry
        run: node scripts/verify-release-acceptance.mjs
      - name: Test release acceptance gate requirements
        run: node --test scripts/test-verify-release-acceptance.mjs
      - name: Validate exact-root flagship Worker contract
        run: node scripts/verify-flagship-root-contract.mjs
      - name: Check exact-root Worker JavaScript syntax
        run: node --check cloudflare/lingo-flagship-root.js
