name: G02 Runner Assignment Probe

on:
  workflow_dispatch:
    inputs:
      incident:
        description: "Recovery incident or evidence reference"
        required: true
        default: "G02-2026-10-10"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g02-assignment-probe
  cancel-in-progress: false

jobs:
  hosted-dispatch-probe:
    name: Hosted runner dispatch and API probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner assignment facts
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          INCIDENT: ${{ inputs.incident }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "incident=$INCIDENT"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_name=$GITHUB_JOB"
            echo "commit=$GITHUB_SHA"
            echo "runner_id=$RUNNER_ID"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            date -u '+captured_at=%Y-%m-%dT%H:%M:%SZ'
          } | tee evidence/runner-assignment.txt
          test -n "$RUNNER_ID"
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Inspect repository runner inventory (read-only)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          code="$(curl --silent --show-error --output evidence/runner-inventory.json --write-out '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/actions/runners")"
          printf '%s\n' "$code" | tee evidence/runner-inventory-http-status.txt
          if [ "$code" = "200" ]; then
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("evidence/runner-inventory.json","utf8"));const rows=(x.runners||[]).map(r=>({id:r.id,name:r.name,status:r.status,busy:r.busy,labels:(r.labels||[]).map(l=>l.name)}));fs.writeFileSync("evidence/runner-inventory-summary.json",JSON.stringify({total_count:x.total_count,runners:rows},null,2));'
          else
            echo "Inventory endpoint denied or unavailable; no runner inventory conclusion may be drawn." | tee evidence/runner-inventory-note.txt
            rm -f evidence/runner-inventory.json
          fi
      - name: Emit evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const path=require("path");const dir="evidence";const files=fs.existsSync(dir)?fs.readdirSync(dir).filter(f=>fs.statSync(path.join(dir,f)).isFile()).sort():[];const manifest={schemaVersion:1,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,commit:process.env.GITHUB_SHA,files:files.map(name=>({name,bytes:fs.statSync(path.join(dir,name)).size}))};fs.writeFileSync(path.join(dir,"manifest.json"),JSON.stringify(manifest,null,2)+"\n");'
          (cd evidence && sha256sum * > SHA256SUMS)
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: g02-runner-assignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  canonical-self-hosted-sentinel:
    name: Canonical lingo-g02 runner sentinel
    if: ${{ vars.LINGO_G02_SENTINEL_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Verify runner identity
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          printf 'G02_RUNNER_ID=%s\nG02_RUNNER_NAME=%s\nG02_SENTINEL=PASS\n' "$RUNNER_ID" "$RUNNER_NAME"
