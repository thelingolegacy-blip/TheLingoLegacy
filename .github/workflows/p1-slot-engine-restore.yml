name: P1 Slot Engine Restore
on:
  push:
    branches:
      - recovery/p1-slot-engine-restore

permissions:
  contents: read

concurrency:
  group: p1-slot-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slot-engine:
    name: GitHub-hosted slot engine tests
    if: github.ref == 'refs/heads/recovery/p1-slot-engine-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record execution context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee evidence/execution-context.txt

      - name: Run deterministic slot-engine tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee evidence/node-test-output.txt

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum package.json src/server/slot-engine.mjs scripts/tests/server-slot-engine.test.mjs > evidence/source-sha256.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-slot-engine-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
