name: G02 Runner Execution Sentinel

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running the G02 sentinel check"
        required: false
        default: "Manual G02 runner dispatch test"
        type: string

permissions:
  contents: read

concurrency:
  group: g02-runner-sentinel
  cancel-in-progress: false

jobs:
  verify-g02-runner:
    name: Verify Self-Hosted Runner Dispatch
    # Keep the canonical label set. Do not remove lingo-g02 to bypass the gate.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Output runner assignment and sentinel telemetry
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUN_REASON: ${{ inputs.reason }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          GITHUB_WORKFLOW_VALUE: ${{ github.workflow }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_JOB_NAME_VALUE: ${{ github.job }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          GITHUB_EVENT_VALUE: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          test -n "$GITHUB_SHA_VALUE"
          test -n "$GITHUB_RUN_ID_VALUE"
          test -n "$GITHUB_RUN_ATTEMPT_VALUE"
          test -n "$GITHUB_REPOSITORY_VALUE"
          test -n "$GITHUB_JOB_NAME_VALUE"

          {
            echo "=========================================="
            echo "G02_SENTINEL=START"
            echo "G02_REPOSITORY=$GITHUB_REPOSITORY_VALUE"
            echo "G02_WORKFLOW=$GITHUB_WORKFLOW_VALUE"
            echo "G02_RUN_ID=$GITHUB_RUN_ID_VALUE"
            echo "G02_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT_VALUE"
            echo "G02_JOB_NAME=$GITHUB_JOB_NAME_VALUE"
            echo "G02_REF=$GITHUB_REF_VALUE"
            echo "G02_COMMIT_SHA=$GITHUB_SHA_VALUE"
            echo "G02_RUNNER_ID_SOURCE=GITHUB_ACTIONS_JOBS_API"
            echo "G02_RUNNER_NAME=$RUNNER_NAME"
            echo "G02_RUNNER_OS=$RUNNER_OS_VALUE"
            echo "G02_RUNNER_ARCH=$RUNNER_ARCH_VALUE"
            echo "G02_TIMESTAMP_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "=========================================="
            echo "G02 SENTINEL EXECUTION CONFIRMED"
            echo "Runner ID source: GitHub Actions Jobs API"
            echo "Runner name: $RUNNER_NAME"
            echo "Runner OS: $RUNNER_OS_VALUE"
            echo "Runner architecture: $RUNNER_ARCH_VALUE"
            echo "Hostname: $(hostname)"
            echo "Kernel: $(uname -srmo)"
            echo "Actor: $GITHUB_ACTOR_VALUE"
            echo "Event: $GITHUB_EVENT_VALUE"
            echo "Reason: $RUN_REASON"
            echo "Commit: $GITHUB_SHA_VALUE"
            echo "=========================================="
            echo "G02_RUNNER_ASSIGNMENT=PASS"
            echo "G02_SENTINEL_EXECUTION=PASS"
            echo "G02_SENTINEL=PASS"
          } | tee g02-sentinel-evidence.txt

      - name: Inspect Docker availability without mutating containers
        shell: bash
        run: |
          set -u
          if command -v docker >/dev/null 2>&1; then
            docker --version
            if docker info >/dev/null 2>&1; then
              echo "DOCKER_DAEMON=ACCESSIBLE"
            else
              echo "DOCKER_DAEMON=UNAVAILABLE_OR_PERMISSION_DENIED"
            fi
          else
            echo "DOCKER_BINARY=NOT_INSTALLED"
          fi

      - name: Upload sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: g02-sentinel-evidence-${{ github.run_id }}
          path: g02-sentinel-evidence.txt
          if-no-files-found: error
