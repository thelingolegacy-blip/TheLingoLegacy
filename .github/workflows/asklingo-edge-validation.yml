name: askLINGO Edge — staging source validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cloudflare/workers/asklingo-v2-staging/**"
      - ".github/workflows/asklingo-edge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asklingo-edge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/workers/asklingo-v2-staging
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Worker
        run: node --check worker.js
      - name: Run fail-closed request tests
        run: npm test
