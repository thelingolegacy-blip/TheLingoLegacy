name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting-scope.mjs'
      - 'scripts/test-firebase-hosting-scope.mjs'
      - '.github/workflows/flutter-firebase-integrity.yml'
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting-scope.mjs'
      - 'scripts/test-firebase-hosting-scope.mjs'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Firebase project contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .firebaserc
          test -f lib/firebase_options.dart
          node scripts/verify-flutter-firebase.mjs

      - name: Verify Firebase Hosting remains disabled
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-firebase-hosting-scope.mjs
          node scripts/test-firebase-hosting-scope.mjs

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test

      - name: Flutter web build
        run: flutter build web --release

      - name: Verify web build output boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -d build/web
          echo "FLUTTER_WEB_OUTPUT=build/web"
          echo "FIREBASE_HOSTING=NOT_CONFIGURED"
