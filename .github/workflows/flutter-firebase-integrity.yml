name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting.mjs'
      - 'docs/FIREBASE-RUNTIME-CONFIGURATION.md'
      - '.github/workflows/flutter-firebase-integrity.yml'
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting.mjs'
      - 'lib/services/**'
      - 'lib/widgets/**'
      - 'docs/FIREBASE-RUNTIME-CONFIGURATION.md'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Web and Android platform scaffolding
        run: flutter create . --platforms=web,android

      - name: Verify Firebase project and stage temporary Dart defines
        shell: bash
        env:
          FIREBASE_OPTIONS_JSON: ${{ secrets.FIREBASE_OPTIONS_JSON }}
          FIREBASE_DART_DEFINES_PATH: ${{ runner.temp }}/firebase-dart-defines.json
        run: |
          set -euo pipefail
          test -f .firebaserc
          test -f lib/firebase_options.dart
          node scripts/verify-flutter-firebase.mjs

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit and widget tests
        env:
          FIREBASE_DART_DEFINES_PATH: ${{ runner.temp }}/firebase-dart-defines.json
        run: flutter test --dart-define-from-file="$FIREBASE_DART_DEFINES_PATH"

      - name: Flutter web build
        env:
          FIREBASE_DART_DEFINES_PATH: ${{ runner.temp }}/firebase-dart-defines.json
        run: flutter build web --release --dart-define-from-file="$FIREBASE_DART_DEFINES_PATH"

      - name: Verify Firebase Hosting publish boundary
        run: node scripts/verify-firebase-hosting.mjs

      - name: Flutter Android debug build
        env:
          FIREBASE_DART_DEFINES_PATH: ${{ runner.temp }}/firebase-dart-defines.json
        run: flutter build apk --debug --dart-define-from-file="$FIREBASE_DART_DEFINES_PATH"

