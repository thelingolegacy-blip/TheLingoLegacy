name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'config/firebase/**'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/test-verify-flutter-firebase.mjs'
      - 'scripts/verify-flutter-android-readiness.mjs'
      - 'scripts/test-verify-flutter-android-readiness.mjs'
      - 'scripts/verify-android-api21-firebase.mjs'
      - 'scripts/test-verify-android-api21-firebase.mjs'
      - 'scripts/build-firebase-public.mjs'
      - 'scripts/test-build-firebase-public.mjs'
      - 'studio-sites/games/oasis-platform/flutter/**'
      - '.github/workflows/flutter-firebase-integrity.yml'
  push:
    branches: ["main"]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'config/firebase/**'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/test-verify-flutter-firebase.mjs'
      - 'scripts/verify-flutter-android-readiness.mjs'
      - 'scripts/test-verify-flutter-android-readiness.mjs'
      - 'scripts/verify-android-api21-firebase.mjs'
      - 'scripts/test-verify-android-api21-firebase.mjs'
      - 'scripts/build-firebase-public.mjs'
      - 'scripts/test-build-firebase-public.mjs'
      - 'studio-sites/games/oasis-platform/flutter/**'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

concurrency:
  group: flutter-firebase-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Verify Firebase project contract
        id: firebase_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f .firebaserc
          test -f lib/firebase_options.dart
          node scripts/verify-flutter-firebase.mjs

      - name: Test Firebase project contract guard
        run: node --test scripts/test-verify-flutter-firebase.mjs

      - name: Test Android readiness gate
        run: node --test scripts/test-verify-flutter-android-readiness.mjs

      - name: Test Android API 21 Firebase contract
        run: node --test scripts/test-verify-android-api21-firebase.mjs

      - name: Verify Android API 21 Firebase contract
        run: node scripts/verify-android-api21-firebase.mjs

      - name: Build quarantined Firebase public output
        run: node scripts/build-firebase-public.mjs

      - name: Test Firebase publication boundary
        run: node --test scripts/test-build-firebase-public.mjs

      - name: Root Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Root Flutter analyze
        run: flutter analyze lib test

      - name: Root Flutter unit and widget tests
        run: flutter test

      - name: Root Flutter web build
        run: flutter build web --release

      - name: Oasis Flutter dependencies
        working-directory: studio-sites/games/oasis-platform/flutter
        run: flutter pub get --enforce-lockfile

      - name: Oasis Flutter analyze
        working-directory: studio-sites/games/oasis-platform/flutter
        run: flutter analyze lib

      - name: Verify Firebase Hosting publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s build/firebase-public/404.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.hosting?.public !== 'build/firebase-public') {
            throw new Error('Firebase Hosting must publish only build/firebase-public');
          }
          const entries = fs.readdirSync('build/firebase-public');
          if (entries.length !== 1 || entries[0] !== '404.html') {
            throw new Error('Quarantined Firebase output must contain only 404.html');
          }
          const page = fs.readFileSync('build/firebase-public/404.html', 'utf8');
          if (!page.includes('noindex,nofollow')) {
            throw new Error('Quarantine page must be noindex,nofollow');
          }
          console.log('FIREBASE_HOSTING_PUBLICATION_BOUNDARY=PASS');
          NODE

      - name: Inspect Android build readiness
        id: android_readiness
        continue-on-error: true
        run: node scripts/verify-flutter-android-readiness.mjs

      - name: Flutter Android debug build
        if: steps.android_readiness.outcome == 'success'
        run: flutter build apk --debug

      - name: Report Android build blocked
        if: steps.android_readiness.outcome == 'failure'
        run: echo '::warning::Android APK build skipped because the checked-in Gradle scaffold or Firebase minSdk contract is incomplete.'

      - name: Upload non-production build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-firebase-integrity-${{ github.sha }}
          path: |
            build/firebase-public/
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Android build readiness
        if: always() && steps.android_readiness.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Android build is blocked by an incomplete Gradle scaffold or incompatible minSdk. Resolve the reported blocker before release."
          exit 1

      - name: Report Firebase integration readiness
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.firebase_contract.outcome }}" == "success" ]]; then
            echo "Firebase staging contract verified."
            echo "Firebase staging contract: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Firebase integration remains BLOCKED because no approved staging project identity/options are configured. No production fallback is permitted."
            {
              echo "## Firebase integration readiness"
              echo "- Status: BLOCKED — no approved staging project identity/options."
              echo "- No production Firebase target or credentials were used."
              echo "- No-Firebase static, unit, widget, and web-build checks continue independently."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
