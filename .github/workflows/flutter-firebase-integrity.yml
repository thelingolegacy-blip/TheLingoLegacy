name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'firebase.client.example.json'
      - '.assetsignore'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/test-verify-flutter-firebase.mjs'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

concurrency:
  group: flutter-firebase-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_ANDROID_PACKAGE_NAME: ${{ vars.FIREBASE_ANDROID_PACKAGE_NAME }}
      FIREBASE_IOS_API_KEY: ${{ vars.FIREBASE_IOS_API_KEY }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_IOS_BUNDLE_ID: ${{ vars.FIREBASE_IOS_BUNDLE_ID }}
      FIREBASE_MACOS_API_KEY: ${{ vars.FIREBASE_MACOS_API_KEY }}
      FIREBASE_MACOS_APP_ID: ${{ vars.FIREBASE_MACOS_APP_ID }}
      FIREBASE_MACOS_BUNDLE_ID: ${{ vars.FIREBASE_MACOS_BUNDLE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Firebase contract validator regression tests
        run: node --test scripts/test-verify-flutter-firebase.mjs

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test

      - name: Flutter web build (preview-safe when Firebase variables are absent)
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID"

      - name: Flutter Android debug build (preview-safe when Firebase variables are absent)
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Verify Flutter Hosting artifact scope and Cloudflare canonical route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const wrangler = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (firebase.hosting?.public !== 'build/web') throw new Error('Firebase Hosting must publish only the Flutter build/web artifact.');
          if (wrangler.workers_dev !== false) throw new Error('Canonical Worker must not expose workers.dev.');
          if (!wrangler.routes?.some((route) => route.pattern === 'thelingolegacy.com/*')) {
            throw new Error('Canonical Cloudflare route is missing.');
          }
          console.log('FIREBASE_HOSTING_SCOPE=BUILD_WEB_ONLY');
          console.log('CLOUDFLARE_CANONICAL_ROUTE=CONFIGURED');
          NODE

      - name: Verify Firebase project and client configuration
        shell: bash
        run: node scripts/verify-flutter-firebase.mjs
