name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - '.github/workflows/flutter-firebase-integrity.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

concurrency:
  group: flutter-firebase-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Firebase project contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .firebaserc
          test -f lib/firebase_options.dart
          node scripts/verify-flutter-firebase.mjs

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test

      - name: Flutter web build
        run: flutter build web --release

      - name: Verify Firebase Hosting publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = config.hosting;
          if (!hosting) throw new Error('Firebase Hosting configuration missing');
          if (hosting.public !== 'build/web') {
            throw new Error(`Unsafe Firebase Hosting public directory: ${hosting.public}`);
          }
          if (!Array.isArray(hosting.ignore) || !hosting.ignore.includes('**/.*')) {
            throw new Error('Firebase Hosting dotfile exclusion missing');
          }
          console.log('FIREBASE_HOSTING_PUBLICATION_BOUNDARY=PASS');
          console.log('FIREBASE_HOSTING_PUBLIC_DIR=build/web');
          NODE

      - name: Flutter Android debug build
        run: flutter build apk --debug

      - name: Upload non-production build evidence
        uses: actions/upload-artifact@v4
        with:
          name: flutter-firebase-integrity-${{ github.sha }}
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
