name: Flutter Firebase Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting.mjs'
      - '.github/workflows/flutter-firebase-integrity.yml'
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/verify-flutter-firebase.mjs'
      - 'scripts/verify-firebase-hosting.mjs'
      - '.github/workflows/flutter-firebase-integrity.yml'

permissions:
  contents: read

jobs:
  flutter-firebase:
    name: Flutter + Firebase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Firebase project contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .firebaserc
          test -f lib/firebase_options.dart
          node scripts/verify-flutter-firebase.mjs

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test

      - name: Flutter web build
        run: flutter build web --release

      - name: Verify Firebase Hosting publish boundary
        run: node scripts/verify-firebase-hosting.mjs

      - name: Flutter Android debug build
        run: flutter build apk --debug
