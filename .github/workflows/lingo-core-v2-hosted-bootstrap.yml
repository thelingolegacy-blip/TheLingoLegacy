name: LINGO CORE V2 Hosted Bootstrap

on:
  pull_request:
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-hosted-bootstrap.yml"
  push:
    branches:
      - "implementation/lingo-core-v2-foundation"
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-hosted-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingo-core-v2-hosted-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-bootstrap:
    name: Hosted runner bootstrap and Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/lingo-core-v2/services/api
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: platform/lingo-core-v2/services/api/go.mod
      - name: Record hosted execution identity
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "github_run_id=${GITHUB_RUN_ID}"
          echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
          go version
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Go packages (database integration tests skip without TEST_DATABASE_URL)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
