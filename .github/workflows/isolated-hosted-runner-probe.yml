name: LINGO Startup Recovery Bootstrap

run-name: LINGO bootstrap / ${{ github.ref_name }} / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: lingo-startup-bootstrap
  cancel-in-progress: false

jobs:
  hosted-bootstrap:
    name: Hosted runner startup and environment verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture hosted runner identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${GITHUB_ACTIONS:-}" = "true"
          {
            echo "schema=lingo-startup-bootstrap-v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "job=${GITHUB_JOB}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_environment=${RUNNER_ENVIRONMENT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee startup-bootstrap-evidence.txt
          echo "identity=PASS" >> "$GITHUB_OUTPUT"

      - name: Verify baseline toolchain and host capacity
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          command -v git
          command -v node
          command -v npm
          command -v python3
          node --version
          npm --version
          git --version
          python3 --version
          uname -a
          cat /etc/os-release
          df -h
          free -h
          echo "baseline=PASS" >> "$GITHUB_OUTPUT"
          echo "baseline_toolchain=PASS" >> startup-bootstrap-evidence.txt

      - name: Publish acceptance summary
        if: always()
        shell: bash
        env:
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
        run: |
          {
            echo "## LINGO Startup Recovery Bootstrap"
            echo
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_NAME:-not-assigned}"
            echo "- Runner environment: ${RUNNER_ENVIRONMENT:-unknown}"
            echo "- Platform: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
            echo "- Provider job ID and runner ID: verify from the GitHub Jobs API; these identifiers are not exposed by the documented runner context."
            echo "- Identity step: ${IDENTITY_RESULT}"
            echo "- Baseline step: ${BASELINE_RESULT}"
            echo "- Scope: GitHub-hosted runner only; no checkout, secrets, external actions, network calls, writes, or production access."
            if [ -f startup-bootstrap-evidence.txt ]; then
              echo
              echo "### Runner evidence record"
              cat startup-bootstrap-evidence.txt
            fi
            if [ "${IDENTITY_RESULT}" = "success" ] && [ "${BASELINE_RESULT}" = "success" ]; then
              echo "- Acceptance: **HOSTED_BOOTSTRAP_PASS**"
            else
              echo "- Acceptance: **HOSTED_BOOTSTRAP_FAIL**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${IDENTITY_RESULT}" = "success" ] && [ "${BASELINE_RESULT}" = "success" ]; then
            echo "HOSTED_BOOTSTRAP_PASS=true"
          else
            echo "HOSTED_BOOTSTRAP_PASS=false"
            exit 1
          fi
