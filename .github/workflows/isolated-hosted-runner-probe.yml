name: Isolated Hosted Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: isolated-hosted-runner-probe
  cancel-in-progress: false

jobs:
  hosted-runner-probe:
    name: Verify hosted runner can instantiate and execute
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture minimal runner evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "=== UTC ==="
          date -u +%FT%TZ
          echo "=== OS ==="
          uname -a
          cat /etc/os-release
          echo "=== Toolchain ==="
          node --version
          npm --version
          git --version
          echo "=== Disk ==="
          df -h
          echo "=== Memory ==="
          free -h
          {
            echo "## Isolated hosted-runner probe"
            echo "- Runner: ${RUNNER_NAME}"
            echo "- OS/architecture: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Result: **HOSTED_RUNNER_JOB_EXECUTED**"
            echo "- Scope: no checkout, external actions, secrets, network calls, artifacts, or production access."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "HOSTED_RUNNER_JOB_EXECUTED=true"
