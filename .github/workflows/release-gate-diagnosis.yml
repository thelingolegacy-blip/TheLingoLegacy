name: Lingo Legacy Release Gate Diagnosis

on:
  push:
    branches: [ "feat/dynamic-master-hub-runtime" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Record execution identity
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "runner_name=${RUNNER_NAME}";
            echo "runner_os=${RUNNER_OS}";
            echo "runner_arch=${RUNNER_ARCH}";
            echo "run_id=${GITHUB_RUN_ID}";
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}";
            echo "job=${GITHUB_JOB}";
            echo "sha=${GITHUB_SHA}";
            echo "ref=${GITHUB_REF}";
            echo "event=${GITHUB_EVENT_NAME}";
            uname -a;
          } | tee runner-execution-evidence.log

      - name: Diagnose repository configuration
        shell: bash
        run: node scripts/diagnose-release-gates.mjs | tee release-gate-diagnosis.log

      - name: Upload diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-release-gate-diagnosis
          path: |
            runner-execution-evidence.log
            release-gate-diagnosis.log
            release-gate-diagnosis.json
          if-no-files-found: warn
