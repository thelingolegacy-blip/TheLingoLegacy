name: Android Release Signing Policy

on:
  pull_request:
    paths:
      - "android/app/build.gradle"
      - "scripts/verify-android-release-signing.mjs"
      - ".github/workflows/android-release-signing-policy.yml"
  push:
    branches:
      - "platform-readiness-hardening-**"
    paths:
      - "android/app/build.gradle"
      - "scripts/verify-android-release-signing.mjs"
      - ".github/workflows/android-release-signing-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release signing policy
        run: node scripts/verify-android-release-signing.mjs
