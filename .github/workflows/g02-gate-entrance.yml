name: G02 Gate Entrance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Assigned G02 task"
        required: true
        type: choice
        options:
          - sentinel
          - host-diagnostics
          - recovery-preflight
        default: sentinel
      reason:
        description: "Change or incident reference"
        required: false
        type: string
        default: "Manual G02 gate entrance verification"

permissions:
  contents: read
  actions: read

concurrency:
  group: g02-gate-entrance
  cancel-in-progress: false

jobs:
  execute-assigned-task:
    name: G02 Gate Entrance / execute-assigned-task
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted repository source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runner assignment and create evidence manifest
        id: identity
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_JOB_VALUE: ${{ github.job }}
          OPERATION: ${{ inputs.operation }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p g02-gate-evidence

          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          test -n "$GITHUB_RUN_ID"
          test -n "$GITHUB_SHA_VALUE"

          JOBS_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          JOB_ID="$(printf '%s' "$JOBS_JSON" | jq -r --arg runner_id "$RUNNER_ID" --arg sha "$GITHUB_SHA_VALUE" '.jobs[] | select((.runner_id|tostring)==$runner_id) | select(.head_sha==$sha) | .id' | head -n1)"
          test -n "$JOB_ID"
          test "$JOB_ID" != "null"
          test "$JOB_ID" -gt 0

          jq -n \
            --arg operation "$OPERATION" \
            --arg reason "$REASON" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_id "$JOB_ID" \
            --arg job_name "$GITHUB_JOB_VALUE" \
            --arg commit_sha "$GITHUB_SHA_VALUE" \
            --arg runner_id "$RUNNER_ID" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            '{
              schema: "lingo-g02-gate-evidence-v1",
              operation: $operation,
              reason: $reason,
              execution: "ACTUAL",
              assignment: "VERIFIED",
              independent_verification: "PENDING",
              formal_acceptance: "PENDING",
              github_run_id: $run_id,
              github_job_id: $job_id,
              github_job_name: $job_name,
              github_commit_sha: $commit_sha,
              runner_id: ($runner_id|tonumber),
              runner_name: $runner_name,
              runner_os: $runner_os,
              runner_arch: $runner_arch,
              runner_environment: $runner_environment
            }' > g02-gate-evidence/assignment.json

          {
            echo "G02_RUNNER_ASSIGNMENT=PASS"
            echo "G02_RUNNER_ID=$RUNNER_ID"
            echo "G02_RUNNER_NAME=$RUNNER_NAME"
            echo "G02_JOB_ID=$JOB_ID"
            echo "G02_RUN_ID=$GITHUB_RUN_ID"
            echo "G02_COMMIT=$GITHUB_SHA_VALUE"
            echo "G02_OPERATION=$OPERATION"
          } | tee g02-gate-evidence/assignment.txt

      - name: Execute sentinel task
        if: inputs.operation == 'sentinel'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sentinel_timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "kernel=$(uname -srmo)"
            echo "git_version=$(git --version)"
            echo "disk=$(df -h / | tail -n1)"
          } | tee g02-gate-evidence/sentinel.txt
          echo "G02_SENTINEL_EXECUTION=PASS" | tee -a g02-gate-evidence/sentinel.txt

      - name: Execute read-only host diagnostics
        if: inputs.operation == 'host-diagnostics'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          RUNNER_DIR="${RUNNER_DIR:-/opt/actions-runner}" \
          OUT_DIR="$PWD/g02-gate-evidence/host-diagnostics" \
          bash ops/g02/diagnose-runner.sh
          rc=$?
          echo "G02_DIAGNOSTIC_SCRIPT_EXIT_CODE=$rc" | tee g02-gate-evidence/diagnostics-result.txt
          exit "$rc"

      - name: Record non-mutating recovery preflight
        if: inputs.operation == 'recovery-preflight'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "G02_RECOVERY_PREFLIGHT=READ_ONLY"
            echo "runner_name=${{ runner.name }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "docker_binary=$(command -v docker || true)"
            echo "docker_version=$(docker --version 2>/dev/null || true)"
            echo "runner_dir_exists=$([[ -d /opt/actions-runner ]] && echo true || echo false)"
            echo "service_mutation=NOT_ATTEMPTED"
            echo "registration_mutation=NOT_ATTEMPTED"
            echo "remote_runner_deletion=NOT_ATTEMPTED"
          } | tee g02-gate-evidence/recovery-preflight.txt

      - name: Hash evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d g02-gate-evidence ]]; then
            find g02-gate-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > g02-gate-evidence/SHA256SUMS
          fi

      - name: Upload G02 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-gate-entrance-${{ github.run_id }}
          path: g02-gate-evidence/
          if-no-files-found: warn
          retention-days: 14
