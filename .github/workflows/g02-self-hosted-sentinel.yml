name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
    inputs:
      incident_ref:
        description: "Required incident or verification ticket reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g02-self-hosted-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    name: Verify isolated G02 runner assignment
    # Manual-only: never run untrusted pull-request code on a self-hosted runner.
    # Configure these labels on a dedicated, least-privileged runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Validate incident reference
        shell: bash
        env:
          INCIDENT_REF: ${{ inputs.incident_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$INCIDENT_REF" =~ ^[A-Za-z0-9._/#:-]{3,120}$ ]]; then
            echo "incident_ref must be 3-120 safe reference characters" >&2
            exit 2
          fi
          echo "Incident reference accepted (value intentionally not echoed)."

      - name: Execute G02 sentinel and record runtime context
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            -o g02-evidence/run-jobs.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('g02-evidence/run-jobs.json', 'utf8'));
          const matches = (payload.jobs ?? []).filter(job =>
            job.name === 'Verify isolated G02 runner assignment' &&
            job.runner_name === process.env.RUNNER_NAME &&
            Number.isSafeInteger(job.id) && job.id > 0 &&
            Number.isSafeInteger(job.runner_id) && job.runner_id > 0
          );
          if (matches.length !== 1) {
            console.error('G02 acceptance blocked: could not uniquely verify the job and numeric runner ID.');
            process.exit(2);
          }
          const job = matches[0];
          fs.writeFileSync('g02-evidence/runner-assignment.json', JSON.stringify({
            run_id: String(process.env.RUN_ID),
            job_id: String(job.id),
            runner_id: job.runner_id,
            runner_name: job.runner_name,
            runner_os: process.env.RUNNER_OS,
            runner_arch: process.env.RUNNER_ARCH,
            repository: process.env.REPOSITORY,
            commit_sha: process.env.COMMIT_SHA
          }, null, 2) + '\n');
          NODE
          rm -f g02-evidence/run-jobs.json
          printf 'G02_SENTINEL_EXECUTED\n'
          {
            cat g02-evidence/runner-assignment.json
            printf 'run_attempt=%s\nincident_ref_present=true\n' "$RUN_ATTEMPT"
          } > g02-evidence/runtime-evidence.txt
          sha256sum g02-evidence/runner-assignment.json g02-evidence/runtime-evidence.txt > g02-evidence/SHA256SUMS
          cat g02-evidence/runtime-evidence.txt
          cat g02-evidence/SHA256SUMS

      - name: Upload sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: g02-sentinel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 14
