name: Studio Enterprise Module Registry
on:
  pull_request:
    paths:
      - "studio/enterprise-module-registry.json"
      - "studio/enterprise-module-registry.schema.json"
      - "scripts/validate-studio-enterprise-module-registry.mjs"
      - "scripts/tests/studio-enterprise-module-registry.test.mjs"
      - ".github/workflows/studio-enterprise-module-registry.yml"
  push:
    branches: ["main"]
    paths:
      - "studio/enterprise-module-registry.json"
      - "studio/enterprise-module-registry.schema.json"
      - "scripts/validate-studio-enterprise-module-registry.mjs"
      - "scripts/tests/studio-enterprise-module-registry.test.mjs"
      - ".github/workflows/studio-enterprise-module-registry.yml"

permissions:
  contents: read

concurrency:
  group: studio-enterprise-module-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test enterprise module registry
        run: node --test scripts/tests/studio-enterprise-module-registry.test.mjs
      - name: Validate enterprise module registry
        run: node scripts/validate-studio-enterprise-module-registry.mjs
