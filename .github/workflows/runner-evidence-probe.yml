name: Actions Runner Evidence Probe

on:
  push:
    branches:
      - security/disable-unscoped-firebase-hosting-2026-11-09
    paths:
      - '.github/workflows/runner-evidence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-runner-evidence-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-runner-probe:
    name: Hosted runner startup and artifact proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture execution evidence
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          mkdir -p evidence
          node --version
          npm --version
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            schema: 'lingo.github-actions-runner-evidence.v1',
            capturedAt: new Date().toISOString(),
            runId: process.env.GH_RUN_ID,
            runAttempt: process.env.GH_RUN_ATTEMPT,
            commitSha: process.env.GH_SHA,
            ref: process.env.GH_REF,
            event: process.env.GH_EVENT,
            workflow: process.env.GH_WORKFLOW,
            actor: process.env.GH_ACTOR,
            runner: {
              os: process.env.RUNNER_OS,
              arch: process.env.RUNNER_ARCH,
              name: process.env.RUNNER_NAME
            },
            tools: {
              node: process.version,
              npm: require('node:child_process').execFileSync('npm', ['--version'], {encoding:'utf8'}).trim()
            },
            result: 'RUNNER_JOB_EXECUTED'
          };
          fs.writeFileSync('evidence/runner-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log('ACTIONS_RUNNER_PROBE=PASS');
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Upload retrievable evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lingo-actions-runner-evidence-${{ github.run_id }}
          path: evidence/runner-evidence.json
          if-no-files-found: error
          retention-days: 14
