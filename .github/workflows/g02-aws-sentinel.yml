name: G02 AWS Sentinel — Fail Closed
on:
  workflow_dispatch:
    inputs:
      evidence_ticket:
        description: Incident reference
        required: true
        default: "#255"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lingo-g02-aws-sentinel
  cancel-in-progress: false
jobs:
  sentinel:
    name: g02-aws-runner-sentinel
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    env:
      EVIDENCE_TICKET: ${{ inputs.evidence_ticket }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "thelingolegacy-blip/TheLingoLegacy"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          mkdir -p g02-evidence
          {
            echo "schema=lingo-g02-sentinel-v1"
            echo "captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit_sha=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "ticket=$EVIDENCE_TICKET"
          } > g02-evidence/workflow-identity.txt
      - name: Read-only host preflight
        shell: bash
        run: bash ops/g02/host-preflight-aws.sh ./g02-evidence
      - name: Sentinel execution proof
        shell: bash
        run: |
          set -euo pipefail
          test -s g02-evidence/g02-host-preflight.txt
          echo "sentinel_exit_code=0" > g02-evidence/sentinel-result.txt
          echo "run_id=$GITHUB_RUN_ID" >> g02-evidence/sentinel-result.txt
          echo "commit_sha=$GITHUB_SHA" >> g02-evidence/sentinel-result.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-aws-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 14
