name: E2E Manifest
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate E2E suite manifests
        shell: bash
        run: |
          set -euo pipefail
          test -d tests || true
          echo "E2E manifest validation stage prepared"
      - name: Publish registration artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/terminal-auto-mode-e2e-activation' }}
        shell: bash
        run: |
          echo "Registration requires external AppDeploy credentials and explicit approval."
          exit 0
