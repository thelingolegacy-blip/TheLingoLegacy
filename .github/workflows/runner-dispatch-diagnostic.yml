name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Establish runner identity
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -n "$GITHUB_SHA_VALUE"
          printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\ngithub_sha=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT" "$GITHUB_SHA_VALUE"

      - name: Execute G02 sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

      - name: Emit forensic exit marker
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_FORENSIC_EXIT_STATUS=0"

