name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  schedule:
    # UTC: run at minute 17 every six hours; job remains protected by if: false.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    # PROTECTED HOLD: keep this disabled until separate G02 release acceptance.
    if: false
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Initialize correlated evidence
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_JOB_VALUE: ${{ github.job }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID_VALUE"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT_VALUE"
            printf 'job=%s\n' "$GITHUB_JOB_VALUE"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_environment=%s\n' "$RUNNER_ENVIRONMENT"
            printf 'github_sha=%s\n' "$GITHUB_SHA_VALUE"
            printf 'platform_check=STARTED\n'
          } > g02-evidence/runner-evidence.txt
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "$GITHUB_SHA_VALUE"
          printf 'platform_check=PASS\n' >> g02-evidence/runner-evidence.txt
          cat g02-evidence/runner-evidence.txt


      - name: Capture runner clock and dependency baseline
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          out=g02-evidence/runner-host-baseline.txt
          {
            echo "captured_at_utc=$(date -u +%FT%TZ)"
            echo "run_id=$GITHUB_RUN_ID_VALUE"
            echo "commit_sha=$GITHUB_SHA_VALUE"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS_VALUE"
            echo "runner_arch=$RUNNER_ARCH_VALUE"
            echo "utc_clock_epoch=$(date -u +%s)"
            if command -v timedatectl >/dev/null 2>&1; then
              echo "ntp_sync=$(timedatectl show -p NTPSynchronized --value 2>/dev/null || echo unavailable)"
            elif command -v chronyc >/dev/null 2>&1; then
              echo "chrony_tracking=available"
              chronyc tracking 2>&1 | sed -n '1,12p'
            else
              echo "ntp_sync=not_observable_by_available_tool"
            fi
            for tool in bash curl git jq sha256sum; do
              if command -v "$tool" >/dev/null 2>&1; then echo "dependency_$tool=present"; else echo "dependency_$tool=missing"; fi
            done
            echo "disk_usage_start"
            df -h "${RUNNER_TEMP:-/tmp}" 2>&1 || true
            echo "memory_start"
            if command -v free >/dev/null 2>&1; then free -h; else echo "memory_tool=unavailable"; fi
            echo "dns_github_com"
            if command -v getent >/dev/null 2>&1 && getent ahosts github.com >/dev/null 2>&1; then echo "dns_github_com=PASS"; else echo "dns_github_com=FAIL_OR_UNAVAILABLE"; fi
            echo "https_github_com"
            if command -v curl >/dev/null 2>&1 && curl -fsSI --max-time 10 https://github.com >/dev/null 2>&1; then echo "https_github_com=PASS"; else echo "https_github_com=FAIL_OR_UNAVAILABLE"; fi
          } | tee "$out"
          for tool in bash curl git jq sha256sum; do command -v "$tool" >/dev/null 2>&1; done

      - name: Execute G02 sentinel
        id: sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" != "lingo-legacy-g02" ]]; then
            echo "runner_identity_check=FAIL" | tee -a g02-evidence/runner-evidence.txt
            echo "RUNNER_EXECUTION_SENTINEL=FAIL" | tee -a g02-evidence/runner-evidence.txt
            exit 1
          fi
          echo "runner_identity_check=PASS" | tee -a g02-evidence/runner-evidence.txt
          echo "RUNNER_EXECUTION_SENTINEL=PASS" | tee -a g02-evidence/runner-evidence.txt

      - name: Emit forensic exit marker
        if: always()
        shell: bash
        env:
          SENTINEL_OUTCOME: ${{ steps.sentinel.outcome }}
        run: |
          if [ -f g02-evidence/runner-evidence.txt ]; then
            if [ "$SENTINEL_OUTCOME" = "success" ]; then
              echo "G02_FORENSIC_EXIT_STATUS=0" | tee -a g02-evidence/runner-evidence.txt
            else
              echo "G02_FORENSIC_EXIT_STATUS=1" | tee -a g02-evidence/runner-evidence.txt
            fi
          fi

      - name: Upload correlated G02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-runner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/runner-evidence.txt
          if-no-files-found: warn
          retention-days: 14
