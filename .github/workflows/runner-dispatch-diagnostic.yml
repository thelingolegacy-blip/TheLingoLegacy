name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Establish runner identity
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "$GITHUB_SHA_VALUE"
          printf 'runner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_environment=%s\ngithub_sha=%s\n' "$RUNNER_ID" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_ENVIRONMENT" "$GITHUB_SHA_VALUE"

      - name: Execute G02 sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          printf 'RUNNER_EXECUTION_SENTINEL=PASS run_id=%s attempt=%s\n' "$RUN_ID" "$RUN_ATTEMPT"

      - name: Emit forensic exit marker
        if: always()
        shell: bash
        run: |
          rc=0
          test "${{ job.status }}" != "failure" || rc=1
          printf 'G02_FORENSIC_EXIT_STATUS=%s\n' "$rc"
          exit "$rc"

      - name: Build correlated evidence manifest
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/g02-evidence"
          mkdir -p "$evidence_dir"
          api_response="$evidence_dir/jobs-api-response.json"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$api_response"
          job_record="$(jq -ce --arg name "$JOB_NAME" --argjson attempt "$RUN_ATTEMPT" '[.jobs[] | select(.name == $name and .run_attempt == $attempt)] | if length == 1 then .[0] else error("expected exactly one correlated job record") end' "$api_response")"
          actual_job_id="$(jq -er '.id | select(. > 0)' <<< "$job_record")"
          actual_runner_id="$(jq -er '.runner_id | select(. > 0)' <<< "$job_record")"
          actual_runner_name="$(jq -er '.runner_name | strings | select(length > 0)' <<< "$job_record")"
          jq -e --arg sha "$COMMIT_SHA" --argjson run "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" \
            '.run_id == $run and .run_attempt == $attempt and .head_sha == $sha' \
            <(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/actions/runs/$RUN_ID") >/dev/null
          jq -n \
            --arg schema_version "lingo.g02.evidence.v2" \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg job_name "$JOB_NAME" \
            --arg ref "$REF_NAME" \
            --arg event "$EVENT_NAME" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg runner_name "$actual_runner_name" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --arg captured_at_utc "$(date -u +%FT%TZ)" \
            --arg sentinel_marker "RUNNER_EXECUTION_SENTINEL=PASS" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson run_number "$RUN_NUMBER" \
            --argjson job_id "$actual_job_id" \
            --argjson runner_id "$actual_runner_id" \
            --argjson observed_labels "$(jq -c '.labels' <<< "$job_record")" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              workflow: $workflow,
              job_name: $job_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_number: $run_number,
              job_id: $job_id,
              ref: $ref,
              event: $event,
              commit_sha: $commit_sha,
              runner: {
                id: $runner_id,
                name: $runner_name,
                os: $runner_os,
                architecture: $runner_arch,
                environment: $runner_environment,
                observed_labels: $observed_labels
              },
              captured_at_utc: $captured_at_utc,
              sentinel_marker: $sentinel_marker,
              capture_phase: "job-running; independent reviewer must retrieve final completed job record and logs"
            }' > "$evidence_dir/manifest.json"
          printf '%s\n' "$job_record" > "$evidence_dir/job-record-at-capture.json"
          sha256sum "$evidence_dir/manifest.json" "$evidence_dir/job-record-at-capture.json" > "$evidence_dir/SHA256SUMS"
          cat "$evidence_dir/manifest.json"
          cat "$evidence_dir/SHA256SUMS"

      - name: Upload correlated G02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-execution-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/g02-evidence/
          if-no-files-found: error
          retention-days: 14
