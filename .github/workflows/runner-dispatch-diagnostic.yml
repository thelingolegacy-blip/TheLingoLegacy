name: G02 Runner Dispatch Diagnostic

on:
  workflow_dispatch:
    inputs:
      incident_reference:
        description: "Approved incident or evidence reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g02-runner-dispatch-diagnostic
  cancel-in-progress: false

jobs:
  runner-sentinel:
    name: runner-sentinel
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Initialize correlated evidence
        shell: bash
        env:
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          {
            printf 'schema=lingo-g02-dispatch-evidence-v1\n'
            printf 'captured_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job_key=%s\n' "$GITHUB_JOB"
            printf 'commit_sha=%s\n' "$GITHUB_SHA"
            printf 'incident_reference=%s\n' "$INCIDENT_REFERENCE"
            printf 'runner_name=%s\n' "$RUNNER_NAME_VALUE"
            printf 'runner_os=%s\n' "$RUNNER_OS_VALUE"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH_VALUE"
            printf 'runner_environment=%s\n' "$RUNNER_ENVIRONMENT_VALUE"
          } > g02-evidence/runner-evidence.txt
          test "${#GITHUB_SHA}" -eq 40
          test "$RUNNER_NAME_VALUE" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          printf 'host_identity_check=PASS\n' >> g02-evidence/runner-evidence.txt

      - name: Execute G02 sentinel
        id: sentinel
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUNNER_EXECUTION_SENTINEL=PASS\n' | tee -a g02-evidence/runner-evidence.txt

      - name: Capture and verify GitHub job allocation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > g02-evidence/jobs-snapshot.json
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path("g02-evidence/jobs-snapshot.json")
          payload = json.loads(path.read_text())
          matches = [job for job in payload.get("jobs", []) if job.get("name") == "runner-sentinel"]
          if len(matches) != 1:
              raise SystemExit(f"FAIL: expected one runner-sentinel job, found {len(matches)}")
          job = matches[0]
          steps = job.get("steps")
          record = {
              "schema": "lingo-g02-runner-allocation-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job_id": job.get("id"),
              "runner_id": job.get("runner_id"),
              "runner_name": job.get("runner_name"),
              "runner_labels": job.get("labels") if isinstance(job.get("labels"), list) else [],
              "commit_sha": os.environ["GITHUB_SHA"],
              "job_status": job.get("status"),
              "job_conclusion": job.get("conclusion"),
              "steps": steps if isinstance(steps, list) else [],
              "job_url_present": bool(job.get("html_url")),\n              "logs_retrievable": False,
              "independent_verification_recorded": False
          }
          pathlib.Path("g02-evidence/runner-allocation.json").write_text(json.dumps(record, indent=2) + "\n")
          if not isinstance(record["job_id"], int) or record["job_id"] <= 0:
              raise SystemExit("FAIL: GitHub API did not return a positive job ID")
          if not isinstance(record["runner_id"], int) or record["runner_id"] <= 0:
              raise SystemExit("FAIL: GitHub API did not return a positive runner ID")
          if record["runner_name"] != "lingo-legacy-g02":
              raise SystemExit("FAIL: GitHub API runner name mismatch")
          required = {"self-hosted", "linux", "x64", "lingo-g02"}
          if not required.issubset(set(record["runner_labels"])):
              raise SystemExit("FAIL: required runner labels are missing")
          if not isinstance(record["steps"], list) or not record["steps"]:
              raise SystemExit("FAIL: GitHub API returned no initialized steps")
          sentinel = [step for step in record["steps"] if step.get("name") == "Execute G02 sentinel"]
          if not sentinel or sentinel[-1].get("conclusion") != "success":
              raise SystemExit("FAIL: sentinel step completion is not independently visible in the job snapshot")
          if record["commit_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("FAIL: commit SHA correlation mismatch")
          PY

      - name: Write SHA-256 checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd g02-evidence
          files=(runner-evidence.txt)
          [[ ! -f runner-allocation.json ]] || files+=(runner-allocation.json)
          [[ ! -f jobs-snapshot.json ]] || files+=(jobs-snapshot.json)
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload correlated G02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-dispatch-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 14
