name: G02 Runner Dispatch Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  dispatch-diagnostic:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Retrieve the actual GitHub job assignment
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'G02_DISPATCH_DIAGNOSTIC=START\nrun_id=%s\ncommit=%s\n' "$GH_RUN_ID" "$GITHUB_SHA_VALUE"
          jobs_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/jobs?per_page=100")"
          runner_identity="$(printf '%s' "$jobs_json" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const job = (payload.jobs || []).find(item => item.name === "dispatch-diagnostic");
              if (!job || job.runner_id == null || !job.runner_name) process.exit(2);
              process.stdout.write(String(job.runner_id) + "\n" + job.runner_name);
            });
          ')" || { echo 'RUNNER_DISPATCH=FAIL: GitHub did not report a real assigned runner'; exit 1; }
          RUNNER_ID="$(printf '%s\n' "$runner_identity" | sed -n '1p')"
          RUNNER_NAME="$(printf '%s\n' "$runner_identity" | sed -n '2p')"
          test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          printf 'runner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_ID" "$RUNNER_NAME" "$RUNNER_OS_VALUE" "$RUNNER_ARCH_VALUE"
          {
            echo "runner_id=$RUNNER_ID"
            echo "runner_name=$RUNNER_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Write dispatch evidence
        id: sentinel
        shell: bash
        env:
          RUNNER_ID: ${{ steps.identity.outputs.runner_id }}
          RUNNER_NAME: ${{ steps.identity.outputs.runner_name }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          echo "G02_DISPATCH_DIAGNOSTIC=PASS"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

      - name: Write sanitized correlated diagnostics
        if: always()
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          SENTINEL_OUTCOME: ${{ steps.sentinel.outcome }}
          RUNNER_ID: ${{ steps.identity.outputs.runner_id }}
          RUNNER_NAME: ${{ steps.identity.outputs.runner_name }}
        run: |
          set -euo pipefail
          mkdir -p release/evidence/g02
          node -e '
            const fs = require("node:fs");
            const runnerId = Number(process.env.RUNNER_ID || 0);
            const valid = process.env.IDENTITY_OUTCOME === "success"
              && process.env.SENTINEL_OUTCOME === "success"
              && runnerId > 0
              && process.env.RUNNER_NAME === "lingo-legacy-g02"
              && Boolean(process.env.GH_SHA);
            const evidence = {
              schemaVersion: "1.0",
              workflow: "G02 Runner Dispatch Diagnostic",
              runId: process.env.GH_RUN_ID,
              runNumber: process.env.GH_RUN_NUMBER,
              runAttempt: process.env.GH_RUN_ATTEMPT,
              commitSha: process.env.GH_SHA,
              ref: process.env.GH_REF,
              runnerId: runnerId || null,
              runnerName: process.env.RUNNER_NAME || null,
              identityOutcome: process.env.IDENTITY_OUTCOME || "not_run",
              sentinelOutcome: process.env.SENTINEL_OUTCOME || "not_run",
              status: valid ? "EXECUTION_SENTINEL_PASS" : "NOT_ESTABLISHED",
              generatedAt: new Date().toISOString()
            };
            fs.writeFileSync("release/evidence/g02/dispatch-diagnostic.json", JSON.stringify(evidence, null, 2) + "\n");
          '

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-dispatch-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/evidence/g02/dispatch-diagnostic.json
          if-no-files-found: warn
