name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5

    steps:
      - name: Establish runner identity
        id: runner
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -n "$GITHUB_SHA_VALUE"
          echo "runner_id=$RUNNER_ID"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "github_sha=$GITHUB_SHA_VALUE"

      - name: Execute G02 sentinel
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

      - name: Emit forensic exit marker
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_FORENSIC_EXIT_STATUS=0"
