name: G02 Self-Hosted Runner Sentinel

on:
  # Deliberately manual: do not enqueue jobs on every push while G02 is being provisioned.
  workflow_dispatch:
    inputs:
      incident_reference:
        description: "Required incident or recovery checkpoint reference"
        required: true
        type: string
      confirm_runner:
        description: "Confirm this run targets the dedicated lingo-legacy-g02 runner"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: g02-runner-sentinel
  cancel-in-progress: false

jobs:
  runner-sentinel:
    if: ${{ inputs.confirm_runner == true && inputs.incident_reference != '' }}
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Initialize correlated evidence
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_JOB_VALUE: ${{ github.job }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          {
            printf 'run_id=%s\\n' "$GITHUB_RUN_ID_VALUE"
            printf 'run_attempt=%s\\n' "$GITHUB_RUN_ATTEMPT_VALUE"
            printf 'job=%s\\n' "$GITHUB_JOB_VALUE"
            printf 'incident_reference=%s\\n' "$INCIDENT_REFERENCE"
            printf 'runner_name=%s\\n' "$RUNNER_NAME"
            printf 'runner_os=%s\\n' "$RUNNER_OS"
            printf 'runner_arch=%s\\n' "$RUNNER_ARCH"
            printf 'runner_environment=%s\\n' "$RUNNER_ENVIRONMENT"
            printf 'github_sha=%s\\n' "$GITHUB_SHA_VALUE"
            printf 'platform_check=STARTED\\n'
          } > g02-evidence/runner-evidence.txt
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "$GITHUB_SHA_VALUE"
          test -n "$INCIDENT_REFERENCE"
          printf 'platform_check=PASS\\n' >> g02-evidence/runner-evidence.txt
          cat g02-evidence/runner-evidence.txt

      - name: Execute G02 sentinel
        id: sentinel
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" != "lingo-legacy-g02" ]]; then
            echo "runner_identity_check=FAIL" | tee -a g02-evidence/runner-evidence.txt
            echo "RUNNER_EXECUTION_SENTINEL=FAIL" | tee -a g02-evidence/runner-evidence.txt
            exit 1
          fi
          echo "runner_identity_check=PASS" | tee -a g02-evidence/runner-evidence.txt
          echo "RUNNER_EXECUTION_SENTINEL=PASS" | tee -a g02-evidence/runner-evidence.txt

      - name: Emit forensic exit marker
        if: always()
        shell: bash
        env:
          SENTINEL_OUTCOME: ${{ steps.sentinel.outcome }}
        run: |
          if [ -f g02-evidence/runner-evidence.txt ]; then
            if [ "$SENTINEL_OUTCOME" = "success" ]; then
              echo "G02_FORENSIC_EXIT_STATUS=0" | tee -a g02-evidence/runner-evidence.txt
            else
              echo "G02_FORENSIC_EXIT_STATUS=1" | tee -a g02-evidence/runner-evidence.txt
            fi
          fi

      - name: Upload correlated G02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-runner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/runner-evidence.txt
          if-no-files-found: warn
          retention-days: 14
