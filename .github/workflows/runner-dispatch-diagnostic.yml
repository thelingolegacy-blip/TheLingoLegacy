name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  runner-sentinel:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Establish runner identity
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME" -a -n "$RUNNER_OS" -a -n "$RUNNER_ARCH"
          test -n "$GITHUB_SHA_VALUE"
          printf 'runner_id=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\ngithub_sha=%s\n' \
            "$RUNNER_ID" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA_VALUE"

      - name: Execute G02 sentinel
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

      - name: Emit forensic exit marker
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_FORENSIC_EXIT_STATUS=0"

  evidence-collector:
    if: ${{ always() }}
    # Evidence collection is intentionally independent of runner execution.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect completed G02 job evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_JOB: runner-sentinel
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          sleep 10
          api="https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100"
          jobs="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$api")"

          python3 - "$jobs" "$TARGET_JOB" <<'PY' > g02-evidence/job.json
          import json,sys
          d=json.loads(sys.argv[1]); target=sys.argv[2]
          m=[j for j in d.get("jobs",[]) if j.get("name")==target]
          if len(m)!=1: raise SystemExit("expected exactly one runner-sentinel job")
          json.dump(m[0],sys.stdout,indent=2)
          PY

          JOB_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' < g02-evidence/job.json)"
          RUNNER_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("runner_id") or 0)' < g02-evidence/job.json)"
          RUNNER_NAME="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("runner_name") or "")' < g02-evidence/job.json)"
          STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' < g02-evidence/job.json)"
          CONCLUSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' < g02-evidence/job.json)"

          python3 - "$RUN_ID" "$WORKFLOW_NAME" "$COMMIT_SHA" "$EVENT_NAME" "$RUN_ATTEMPT" \
            "$JOB_ID" "$STATUS" "$CONCLUSION" > g02-evidence/01_run_identity.json <<'PY'
          import json,sys
          print(json.dumps({"run_id":int(sys.argv[1]),"workflow":sys.argv[2],
            "commit_sha":sys.argv[3],"event":sys.argv[4],"run_attempt":int(sys.argv[5]),
            "job_id":int(sys.argv[6]),"job_status":sys.argv[7],
            "job_conclusion":sys.argv[8]},indent=2))
          PY

          python3 - "$JOB_ID" "$STATUS" "$CONCLUSION" "$RUNNER_ID" "$RUNNER_NAME" \
            > g02-evidence/02_job_identity.json <<'PY'
          import json,sys
          print(json.dumps({"job_id":int(sys.argv[1]),"status":sys.argv[2],
            "conclusion":sys.argv[3],"runner_id":int(sys.argv[4]),
            "runner_name":sys.argv[5]},indent=2))
          PY

          curl --fail-with-body --silent --show-error \
            -L -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/$JOB_ID/logs" \
            > g02-evidence/07_raw_job_logs

          python3 - "$RUNNER_ID" "$RUNNER_NAME" "$STATUS" "$CONCLUSION" \
            > g02-evidence/03_runner_telemetry.json <<'PY'
          import json,sys
          with open("g02-evidence/07_raw_job_logs",errors="replace") as f:
              logs=f.read()
          def value(key):
              for line in logs.splitlines():
                  if line.strip().startswith(key+"="):
                      return line.split("=",1)[1].strip()
              return ""
          rid=int(sys.argv[1]); name=sys.argv[2]
          os_name=value("runner_os"); arch=value("runner_arch")
          if rid<=0 or not name or not os_name or not arch:
              raise SystemExit("runner telemetry incomplete")
          print(json.dumps({"runner_id":rid,"runner_name":name,
            "runner_os":os_name,"runner_arch":arch,
            "assignment":["self-hosted","linux","x64","lingo-g02"]},indent=2))
          PY

          python3 - <<'PY' > g02-evidence/04_step_telemetry.json
          import json
          with open("g02-evidence/job.json") as f:
              job=json.load(f)
          steps=job.get("steps") or []
          if not steps:
              raise SystemExit("step telemetry unavailable: job has no instantiated steps")
          print(json.dumps({"steps": steps}, indent=2))
          PY

          python3 - <<'PY'
          grep -Fqx 'RUNNER_EXECUTION_SENTINEL=PASS' g02-evidence/07_raw_job_logs
          grep -Fqx 'G02_FORENSIC_EXIT_STATUS=0' g02-evidence/07_raw_job_logs
          printf '%s\n' 'RUNNER_EXECUTION_SENTINEL=PASS' > g02-evidence/05_sentinel.log
          printf '%s\n' 'G02_FORENSIC_EXIT_STATUS=0' > g02-evidence/06_exit_status.json

          sha256sum g02-evidence/01_run_identity.json \
            g02-evidence/02_job_identity.json \
            g02-evidence/03_runner_telemetry.json \
            g02-evidence/04_step_telemetry.json \
            g02-evidence/05_sentinel.log \
            g02-evidence/06_exit_status.json \
            g02-evidence/07_raw_job_logs > g02-evidence/08_integrity.json

      - name: Upload G02 live evidence envelope
        uses: actions/upload-artifact@v4
        with:
          name: g02-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 14

# G02 execution trigger: controlled push