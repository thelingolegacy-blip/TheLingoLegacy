name: Legacy API Contract Tests (Non-Deploying)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/legacy-api-compatibility-2026-10-23

permissions:
  contents: read

concurrency:
  group: legacy-api-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-tests:
    name: API contract unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check changed JavaScript
        run: |
          set -euo pipefail
          node --input-type=module --check < worker.js
          node --check scripts/verify-dynamic-runtime.mjs
          node --check scripts/test-verify-dynamic-runtime.mjs
          node --check tests/worker-legacy-api-compatibility.test.mjs
      - name: Test legacy API compatibility handlers
        run: node --test tests/worker-legacy-api-compatibility.test.mjs
      - name: Test dynamic runtime contract
        run: node --test scripts/test-verify-dynamic-runtime.mjs
      - name: Verify required runtime routes
        run: node scripts/verify-dynamic-runtime.mjs
