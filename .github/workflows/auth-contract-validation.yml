name: LINGO Authentication Contract Validation

on:
  pull_request:
    paths:
      - "infrastructure/registry/authentication-integrations.json"
      - "scripts/verify-auth-contract.mjs"
      - "docs/security/**"
      - ".github/workflows/auth-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingo-auth-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-auth-contract:
    name: Validate authentication inventory and policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate registry and fail-closed rules
        run: node scripts/verify-auth-contract.mjs
