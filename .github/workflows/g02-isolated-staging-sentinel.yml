name: G02 Isolated Staging Sentinel

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "Type STAGING to authorize a staging-only probe"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g02-staging-sentinel
  cancel-in-progress: false

jobs:
  staging-sentinel:
    if: ${{ inputs.confirm_staging_only == 'STAGING' }}
    runs-on: [self-hosted, linux, x64, lingo-legacy-g02-staging]
    timeout-minutes: 5
    steps:
      - name: Verify staging runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" != ""
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          case "$RUNNER_NAME" in
            *staging*) ;;
            *) echo "::error::Runner name must explicitly identify staging"; exit 1 ;;
          esac
          printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: Verify basic runtime and outbound HTTPS
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          command -v python3
          python3 --version
          python3 - <<'PY'
          import json, os, socket, ssl, urllib.request, datetime
          hosts = ["github.com", "api.github.com"]
          checks = {}
          for host in hosts:
              try:
                  socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  req = urllib.request.Request("https://" + host, method="HEAD")
                  with urllib.request.urlopen(req, timeout=8) as response:
                      checks[host] = {"dns": "pass", "https_status": response.status}
              except Exception as exc:
                  checks[host] = {"error_type": type(exc).__name__, "error": str(exc)[:240]}
          record = {
              "schema": "lingo-g02-staging-sentinel-v1",
              "captured_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "checks": checks
          }
          os.makedirs("g02-staging-evidence", exist_ok=True)
          with open("g02-staging-evidence/staging-sentinel.json", "w") as f:
              json.dump(record, f, indent=2, sort_keys=True)
          print(json.dumps(record, indent=2, sort_keys=True))
          if any("error" in item for item in checks.values()):
              raise SystemExit("One or more outbound HTTPS checks failed")
          PY
      - name: Hash evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum g02-staging-evidence/staging-sentinel.json > g02-staging-evidence/staging-sentinel.json.sha256
          cat g02-staging-evidence/staging-sentinel.json.sha256
      - name: Upload correlated staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: g02-staging-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-staging-evidence/
          if-no-files-found: error
          retention-days: 7
