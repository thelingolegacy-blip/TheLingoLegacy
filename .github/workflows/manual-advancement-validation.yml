name: LINGO Manual Advancement Validation

on:
  pull_request:
    paths:
      - "ops/manual-control/**"
      - ".github/workflows/manual-advancement.yml"
      - ".github/workflows/manual-advancement-validation.yml"
      - "docs/manual-advancement-charter.md"
  push:
    branches:
      - "manual-control/**"
    paths:
      - "ops/manual-control/**"
      - ".github/workflows/manual-advancement.yml"
      - ".github/workflows/manual-advancement-validation.yml"
      - "docs/manual-advancement-charter.md"

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shell syntax and project registry JSON
        run: |
          bash -n ops/manual-control/validate-transition.sh
          bash -n ops/manual-control/test-validator.sh
          bash -n ops/manual-control/record-transition.sh
          python3 -m json.tool ops/manual-control/projects.json > /dev/null
      - name: Run transition validator tests
        run: bash ops/manual-control/test-validator.sh
