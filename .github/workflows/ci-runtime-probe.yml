name: Lingo Legacy Diagnostic Bridge

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "route/vercel-preview-2026-09-20"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner identity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/evidence
          {
            printf 'DIAGNOSTIC_BRIDGE=STARTED
'
            printf 'RUNNER_NAME=%s
' "$RUNNER_NAME"
            printf 'RUNNER_OS=%s
' "$RUNNER_OS"
            printf 'RUNNER_ARCH=%s
' "$RUNNER_ARCH"
            printf 'RUNNER_LABEL=ubuntu-24.04
'
            printf 'GITHUB_SHA=%s
' "$GITHUB_SHA"
            printf 'GITHUB_REF=%s
' "$GITHUB_REF"
            printf 'GITHUB_EVENT_NAME=%s
' "$GITHUB_EVENT_NAME"
            node --version
            npm --version
            git --version
          } | tee release/evidence/diagnostic-runtime.txt

      - name: Static route evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f app/verification/index.html
          printf 'VERIFICATION_ROUTE_SOURCE=FOUND
' | tee release/evidence/diagnostic-route.txt

      - name: Finalize diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'DIAGNOSTIC_BRIDGE=PASS
SHA=%s
' "$GITHUB_SHA" > release/evidence/diagnostic-result.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-legacy-diagnostic-bridge-${{ github.run_id }}
          path: release/evidence
          if-no-files-found: error
