name: Cleanroom Recovery Build

run-name: Cleanroom recovery validation — ${{ github.ref_name }} — ${{ github.run_id }}

on:
  push:
    branches:
      - recovery/cleanroom-actions-build-2026-10-24
  pull_request:
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "scripts/test-api-endpoint-contract.mjs"
      - "scripts/test-verify-dynamic-runtime.mjs"
      - "scripts/verify-dynamic-runtime.mjs"
      - ".github/workflows/cleanroom-recovery-build.yml"
  workflow_dispatch:
    inputs:
      incident_ref:
        description: "Incident or verification reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cleanroom-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanroom:
    name: Cleanroom runner, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure isolated Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true

      - name: Record runner and source identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: ${{ github.job }}
          COMMIT_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --version | tee evidence/node-version.txt
          npm --version | tee evidence/npm-version.txt
          printf '%s\n' "$REPOSITORY" > evidence/repository.txt
          printf '%s\n' "$COMMIT_SHA" > evidence/commit-sha.txt
          printf '%s\n' "$RUN_ID" > evidence/run-id.txt
          printf '%s\n' "$RUN_ATTEMPT" > evidence/run-attempt.txt
          printf '%s\n' "$RUNNER_NAME" > evidence/runner-name.txt
          printf '%s\n' "$RUNNER_OS" > evidence/runner-os.txt
          printf '%s\n' "$RUNNER_ARCH" > evidence/runner-arch.txt
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            -o evidence/jobs-api.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('evidence/jobs-api.json', 'utf8'));
          const jobs = (p.jobs ?? []).filter(j =>
            j.name === 'Cleanroom runner, tests, and build' &&
            j.runner_name === process.env.RUNNER_NAME &&
            Number.isSafeInteger(j.id) && j.id > 0 &&
            Number.isSafeInteger(j.runner_id) && j.runner_id > 0
          );
          if (jobs.length !== 1) {
            console.error('FAIL: could not uniquely verify numeric job and runner IDs through the Actions API.');
            process.exit(2);
          }
          fs.writeFileSync('evidence/runner-assignment.json', JSON.stringify({
            run_id: process.env.RUN_ID,
            run_attempt: process.env.RUN_ATTEMPT,
            repository: process.env.REPOSITORY,
            commit_sha: process.env.COMMIT_SHA,
            job_id: jobs[0].id,
            job_name: jobs[0].name,
            runner_id: jobs[0].runner_id,
            runner_name: jobs[0].runner_name,
            runner_os: process.env.RUNNER_OS,
            runner_arch: process.env.RUNNER_ARCH,
            job_status_at_capture: jobs[0].status,
            captured_at_utc: new Date().toISOString()
          }, null, 2) + '\n');
          NODE
          test -s evidence/runner-assignment.json
          echo "Runner and job IDs verified by GitHub Actions API."

      - name: Run actual Node.js contract suite
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-api-endpoint-contract.mjs scripts/test-verify-dynamic-runtime.mjs 2>&1 | tee evidence/node-test.log

      - name: Run fail-closed runtime source verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-dynamic-runtime.mjs 2>&1 | tee evidence/runtime-verifier.log

      - name: Build Cloudflare Worker without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/lingo-cleanroom-worker-build --config wrangler.jsonc 2>&1 | tee evidence/wrangler-dry-run.log
          test -s /tmp/lingo-cleanroom-worker-build/worker.js
          printf 'dry_run_build=PASS\n' | tee evidence/build-result.txt

      - name: Check evidence completeness and hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "commit_sha=${{ github.sha }}"
            echo "job_status=${{ job.status }}"
            echo "captured_at_utc=$(date -u +%FT%TZ)"
          } > evidence/run-summary.txt
          if [ -f evidence/runner-assignment.json ]; then
            node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('evidence/runner-assignment.json','utf8')); if(!(r.job_id>0&&r.runner_id>0&&r.runner_name)) process.exit(1); console.log('runner_assignment=PASS')" >> evidence/run-summary.txt
          else
            echo "runner_assignment=FAIL_OR_NOT_STARTED" >> evidence/run-summary.txt
          fi
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/SHA256SUMS.txt

      - name: Upload cleanroom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
