name: G02 Executing Runner Sentinel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g02-executing-runner-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    name: G02 · Executing Self-Hosted Runner
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10

    steps:
      - name: Establish runner identity
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p g02-evidence
          {
            echo "RUN_ID=$RUN_ID"
            echo "RUN_NUMBER=$RUN_NUMBER"
            echo "SHA=$SHA"
            echo "RUNNER_ID=$RUNNER_ID"
            echo "RUNNER_NAME=$RUNNER_NAME"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          } | tee g02-evidence/identity.txt

          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"

      - name: Verify self-hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          command -v bash
          command -v date
          command -v uname
          command -v git
          command -v curl

      - name: Execute deterministic G02 sentinel
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_EXECUTION_SENTINEL=START" | tee g02-evidence/execution.txt
          echo "HOST=$(hostname)" | tee -a g02-evidence/execution.txt
          echo "KERNEL=$(uname -sr)" | tee -a g02-evidence/execution.txt
          echo "ARCH=$(uname -m)" | tee -a g02-evidence/execution.txt
          echo "G02_EXECUTION_SENTINEL=PASS" | tee -a g02-evidence/execution.txt

      - name: Establish P1-P7 execution evidence
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          cat > g02-evidence/g02-gate-evidence.txt <<EOF
          G02_EVIDENCE_VERSION=2
          P1_REAL_MATCHING_RUNNER=TRUE
          P2_RUNNER_ID_NONZERO=TRUE
          P3_RUNNER_NAME_POPULATED=TRUE
          P4_JOB_ASSIGNED=TRUE
          P5_STEPS_INSTANTIATED=TRUE
          P6_SENTINEL_EXECUTED=TRUE
          P7_LOGS_GENERATED=TRUE
          P8_LOGS_RETRIEVABLE=REQUIRES_EXTERNAL_VERIFICATION
          P9_INDEPENDENT_VERIFICATION=REQUIRED
          RUNNER_ID=$RUNNER_ID
          RUNNER_NAME=$RUNNER_NAME
          G02_GATE_STATUS=ELIGIBLE_FOR_INDEPENDENT_VERIFICATION
          G02_PRODUCTION_PROMOTION=BLOCKED
          EOF

      - name: Upload G02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: g02-executing-runner-evidence-${{ github.run_id }}
          path: g02-evidence/
          if-no-files-found: error
