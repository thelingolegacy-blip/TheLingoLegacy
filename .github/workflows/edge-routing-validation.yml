name: Edge Routing Contract Validation

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'worker.js'
      - 'scripts/verify-edge-routing.mjs'
      - 'scripts/verify-g02-evidence.mjs'
      - '.github/workflows/edge-routing-validation.yml'
  push:
    branches:
      - main
      - recovery/edge-routing-reconciliation-2026-10-10
    paths:
      - 'wrangler.jsonc'
      - 'worker.js'
      - 'scripts/verify-edge-routing.mjs'
      - '.github/workflows/edge-routing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-routing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static edge routing contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: Record correlated evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --version | tee evidence/node-version.txt
          git rev-parse HEAD | tee evidence/commit-sha.txt
          printf 'run_id=%s\nrun_attempt=%s\nrun_number=%s\ncommit_sha=%s\nref=%s\nevent=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_RUN_NUMBER}" \
            "${GITHUB_SHA}" "${GITHUB_REF}" "${GITHUB_EVENT_NAME}" \
            > evidence/run-metadata.txt

      - name: Verify deployment identity and Worker contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-edge-routing.mjs
          node --check scripts/verify-g02-evidence.mjs
          node scripts/verify-edge-routing.mjs 2>&1 | tee evidence/edge-routing-verification.log

      - name: Upload routing verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-routing-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
