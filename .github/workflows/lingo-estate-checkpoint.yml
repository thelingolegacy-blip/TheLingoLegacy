name: LINGO Estate Checkpoint

on:
  workflow_dispatch:
    inputs:
      checkpoint_label:
        description: "Human-readable checkpoint label"
        required: true
        default: "manual-recovery-checkpoint"
        type: string

permissions:
  contents: read

concurrency:
  group: lingo-estate-checkpoint
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact checkpoint commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate estate manifests
        env:
          CHECKPOINT_LABEL: ${{ inputs.checkpoint_label }}
        run: |
          set -euo pipefail
          node -e 'for (const p of ["ops/estate/estate-manifest.json","ops/estate/ruleset-policy.json","ops/estate/activation-registry.json"]) JSON.parse(require("fs").readFileSync(p,"utf8"));'
          mkdir -p .build/estate-checkpoint
          cp ops/estate/estate-manifest.json ops/estate/ruleset-policy.json ops/estate/activation-registry.json .build/estate-checkpoint/
          {
            echo "label=$CHECKPOINT_LABEL"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            date -u '+captured_at=%Y-%m-%dT%H:%M:%SZ'
            echo "restore_mode=DRY_RUN_ONLY"
            echo "production_mutation=FORBIDDEN"
          } > .build/estate-checkpoint/checkpoint-metadata.txt
          (cd .build/estate-checkpoint && sha256sum * > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: lingo-estate-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/estate-checkpoint/
          if-no-files-found: error
          retention-days: 30
