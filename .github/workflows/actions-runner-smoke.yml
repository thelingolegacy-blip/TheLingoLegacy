name: Lingo Legacy Actions Runner Smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: actions-runner-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner reached execution stage
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=reachable"
          echo "runner_id=${RUNNER_ID:-unknown}"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "github_sha=${GITHUB_SHA:-unknown}"
          echo "workspace=${GITHUB_WORKSPACE:-unknown}"

      - name: Emit execution sentinel
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_EXECUTION_SENTINEL=PASS"
          test -n "${RUNNER_NAME:-}"
          test -n "${GITHUB_SHA:-}"
