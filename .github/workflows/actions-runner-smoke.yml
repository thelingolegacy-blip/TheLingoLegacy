name: Lingo Legacy Actions Runner Smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  actions: read

concurrency:
  group: actions-runner-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    steps:
      - name: Resolve and validate GitHub runner assignment
        id: assert
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
          RUNNER_NAME_CONTEXT: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA_VALUE" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNER_NAME_CONTEXT" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"

          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"

          ASSIGNMENT="$(printf '%s' "$JOBS_JSON" | node -e '
            let data = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(data);
              const matches = (payload.jobs || []).filter(job => job.name === process.env.JOB_ID);
              if (matches.length !== 1) process.exit(2);
              const job = matches[0];
              if (!Number.isInteger(job.runner_id) || job.runner_id <= 0) process.exit(3);
              if (job.runner_name !== "lingo-legacy-g02") process.exit(4);
              process.stdout.write(job.runner_id + "\\t" + job.runner_name);
            });
          ')"
          IFS=$'\t' read -r RUNNER_ID RUNNER_NAME_API <<< "$ASSIGNMENT"
          [[ "$RUNNER_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RUNNER_NAME_API" = "lingo-legacy-g02"
          echo "runner_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "runner_id=$RUNNER_ID"
          echo "runner_name=$RUNNER_NAME_API"
          echo "runner_name_context=$RUNNER_NAME_CONTEXT"
          echo "runner_os=$RUNNER_OS_VALUE"
          echo "runner_arch=$RUNNER_ARCH_VALUE"
          echo "github_sha=$GITHUB_SHA_VALUE"

      - name: Emit execution sentinel
        id: sentinel
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.assert.outputs.runner_gate }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = "PASS"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"
