name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  # Tags do not authorize production mutation. Production promotion is explicit via workflow_dispatch.

permissions:
  contents: read

concurrency:
  group: lingo-legacy-promotion-${{ inputs.environment || 'manual' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
      runner_id: ${{ steps.assert.outputs.runner_id }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - name: Runner reached execution stage
        id: assert
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" || { echo 'RUNNER_ID missing'; exit 1; }
          test "$RUNNER_ID" != "0" || { echo 'RUNNER_ID is zero'; exit 1; }
          test -n "$RUNNER_NAME" || { echo 'RUNNER_NAME missing'; exit 1; }
          test -n "$RUNNER_OS_VALUE" || { echo 'RUNNER_OS missing'; exit 1; }
          test -n "$RUNNER_ARCH_VALUE" || { echo 'RUNNER_ARCH missing'; exit 1; }
          test -n "$GITHUB_SHA_VALUE" || { echo 'GITHUB_SHA missing'; exit 1; }
          echo "RUNNER_GATE=PASS" >> "$GITHUB_OUTPUT"
          echo "runner_id=$RUNNER_ID" >> "$GITHUB_OUTPUT"
          echo "runner_name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"
          echo "RUNNER_GATE=PASS"
          echo "RUNNER_ID=$RUNNER_ID"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS_VALUE"
          echo "RUNNER_ARCH=$RUNNER_ARCH_VALUE"
          echo "GITHUB_SHA=$GITHUB_SHA_VALUE"
      - name: Runner gate completion assertion
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.assert.outputs.runner_gate }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = "PASS" || { echo 'RUNNER_GATE != PASS'; exit 1; }
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

  gates:
    needs: runner-gate
    if: ${{ needs.runner-gate.outputs.runner_gate == 'PASS' }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Cloudflare binding contract gate
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Production authority-chain gate
        run: node scripts/verify-production-authority.mjs
      - name: Dynamic runtime contract gate
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Wrangler configuration validation
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude='./.git' --exclude='./release/evidence' -cf release-artifact.tar .
          echo "artifact=$(sha256sum release-artifact.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/

  cloudflare:
    needs: gates
    if: ${{ inputs.environment == 'staging' || inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Re-run repository production gates
        run: |
          node scripts/sanitize-cloudflare-only-surface.mjs
          node scripts/verify-cloudflare-only.mjs
          node scripts/verify-cloudflare-bindings.mjs
          node scripts/verify-production-authority.mjs
          node scripts/verify-dynamic-runtime.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: release/evidence/wrangler-output.ndjson
        run: |
          set -euo pipefail
          mkdir -p release/evidence
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Capture deployment identity evidence
        env:
          EXPECTED_COMMIT: ${{ needs.gates.outputs.commit }}
          EXPECTED_ARTIFACT: ${{ needs.gates.outputs.artifact }}
        run: |
          set -euo pipefail
          test -s release/evidence/wrangler-output.ndjson
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('release/evidence/wrangler-output.ndjson','utf8')
            .split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const deploys = lines.filter((entry) => entry.type === 'deploy' && typeof entry.version_id === 'string' && entry.version_id.trim());
          if (deploys.length !== 1) {
            throw new Error(`Expected exactly one successful Wrangler deploy identity; found ${deploys.length}`);
          }
          const deploy = deploys[0];
          const commitSha = process.env.EXPECTED_COMMIT;
          const artifactDigest = process.env.EXPECTED_ARTIFACT;
          if (!commitSha || !artifactDigest) throw new Error('Release identity outputs are missing');
          const evidence = {
            schemaVersion: '1.0',
            status: 'PASS',
            source: 'wrangler-output',
            workerName: deploy.worker_name || null,
            versionId: deploy.version_id,
            deploymentId: deploy.version_id,
            commitSha,
            artifactDigest,
            capturedAt: deploy.timestamp || new Date().toISOString(),
            target: deploy.targets || []
          };
          fs.writeFileSync('release/evidence/deployment-identity.json', JSON.stringify(evidence, null, 2) + '\n');
          fs.writeFileSync('release/evidence/rollback.json', JSON.stringify({
            schemaVersion: '1.0',
            status: 'PASS',
            target: deploy.version_id,
            commitSha,
            artifactDigest,
            deploymentId: deploy.version_id,
            certificateId: null,
            selectionPolicy: 'KNOWN_GOOD_ONLY',
            verificationRequired: true,
            liveProbeRequiredAfterRollback: true,
            recoveryCertificateRequired: true
          }, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - name: Resolve canonical production URL
        id: config
        shell: bash
        run: |
          set -euo pipefail
          domain=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).canonicalDomain)")
          echo "base_url=https://${domain}" >> "$GITHUB_OUTPUT"
      - name: Live probes
        env:
          LIVE_BASE_URL: ${{ steps.config.outputs.base_url }}
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: node scripts/live-probes.mjs
      - name: Upload deployment and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-live-probes-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error

  certificate:
    needs: [gates, cloudflare]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/gate

      - name: Download deployment and live evidence
        uses: actions/download-artifact@v4
        with:
          name: lingo-live-probes-${{ github.run_id }}
          path: release/evidence/live

      - name: Normalize release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/evidence/current
          release_dir=$(find release/evidence/gate -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$release_dir" || { echo 'No release-specific gate evidence directory found'; exit 1; }
          for file in manifest.json commit.json build.json gates.json; do
            test -f "$release_dir/$file" || { echo "Missing gate evidence: $release_dir/$file"; exit 1; }
            cp "$release_dir/$file" "release/evidence/current/$file"
          done
          test -f release/evidence/live/live-probes.json
          cp release/evidence/live/live-probes.json release/evidence/current/live-probes.json
          test -f release/evidence/live/rollback.json
          cp release/evidence/live/rollback.json release/evidence/current/rollback.json
          test -f release/evidence/live/deployment-identity.json
          cp release/evidence/live/deployment-identity.json release/evidence/current/deployment-identity.json

      - name: Generate repository evidence report
        run: node scripts/lingo-autorepair.mjs
      - name: Verify certification evidence
        env:
          ROLLBACK_FILE: release/evidence/current/rollback.json
        run: node scripts/verify-certification-evidence.mjs
      - name: Certification boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'CERTIFICATION=PASS'
