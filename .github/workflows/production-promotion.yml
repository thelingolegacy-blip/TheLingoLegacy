name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  # Tags do not authorize production mutation. Production promotion is explicit via workflow_dispatch.

permissions:
  contents: read
  actions: read

concurrency:
  group: lingo-legacy-promotion-${{ inputs.environment || 'manual' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    # G02 is the authoritative runner boundary. Do not substitute a GitHub-hosted runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
      runner_id: ${{ steps.assert.outputs.runner_id }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - name: Runner reached execution stage
        id: assert
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          jobs_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/jobs?per_page=100")"
          runner_identity="$(printf '%s' "$jobs_json" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const job = (payload.jobs || []).find(item => item.name === "runner-gate");
              if (!job || job.runner_id == null || !job.runner_name) process.exit(2);
              process.stdout.write(String(job.runner_id) + "\n" + job.runner_name);
            });
          ')" || { echo 'GitHub API did not return an assigned runner identity'; exit 1; }
          RUNNER_ID="$(printf '%s\n' "$runner_identity" | sed -n '1p')"
          RUNNER_NAME="$(printf '%s\n' "$runner_identity" | sed -n '2p')"
          test -n "$RUNNER_ID" || { echo 'RUNNER_ID missing'; exit 1; }
          test "$RUNNER_ID" != "0" || { echo 'RUNNER_ID is zero'; exit 1; }
          test "$RUNNER_NAME" = "lingo-legacy-g02" || { echo 'RUNNER_NAME mismatch'; exit 1; }
          test "$RUNNER_OS_VALUE" = "Linux" || { echo 'RUNNER_OS missing'; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo 'RUNNER_ARCH mismatch'; exit 1; }
          test -n "$GITHUB_SHA_VALUE" || { echo 'GITHUB_SHA missing'; exit 1; }
          echo "RUNNER_GATE=PASS" >> "$GITHUB_OUTPUT"
          echo "runner_id=$RUNNER_ID" >> "$GITHUB_OUTPUT"
          echo "runner_name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"
          echo "G02_RUNNER_ASSIGNMENT=PASS"
          echo "RUNNER_GATE=PASS"
          echo "RUNNER_ID=$RUNNER_ID"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS_VALUE"
          echo "RUNNER_ARCH=$RUNNER_ARCH_VALUE"
          echo "GITHUB_SHA=$GITHUB_SHA_VALUE"
      - name: Runner gate completion assertion
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.assert.outputs.runner_gate }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = "PASS" || { echo 'RUNNER_GATE != PASS'; exit 1; }
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

  gates:
    needs: runner-gate
    if: ${{ needs.runner-gate.outputs.runner_gate == 'PASS' }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.build-bundle.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Cloudflare binding contract gate
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Production authority-chain gate
        run: node scripts/verify-production-authority.mjs
      - name: Dynamic runtime contract gate
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Wrangler configuration validation
        run: |
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
          npx --yes wrangler@4 deploy --dry-run --config wrangler.staging.jsonc
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("wrangler.staging.jsonc","utf8"));if(c.name!=="thelingolegacy-staging")throw Error("unexpected staging worker name");if(c.assets?.directory!=="./staging-public")throw Error("staging assets must use the restricted staging-public directory");if((c.routes||[]).length)throw Error("staging configuration must not claim production custom routes");if(!c.workers_dev)throw Error("staging must be isolated to workers.dev");if(c.vars?.CANONICAL_DOMAIN!=="thelingolegacy-staging.thelingolegacy.workers.dev")throw Error("staging canonical domain mismatch");console.log("STAGING_CONFIG_ISOLATION=PASS")'
          test -f staging-public/index.html
          if grep -R -n --exclude-dir=.git --exclude='wrangler.staging.jsonc' '__LINGO_DEPLOYMENT_DISABLED__\|__LINGO_PREVIEW_DISABLED__' staging-public; then
            echo 'Staging public surface contains internal control markers'; exit 1
          fi
      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and seal the staging release bundle
        id: build-bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf .wrangler-build
          mkdir -p .wrangler-build
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-build --config wrangler.staging.jsonc
          mkdir -p .wrangler-build/evidence-tools

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFileSync, cpSync, lstatSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { basename, join, relative, sep } from 'node:path';
          const root = '.wrangler-build';
          const jsFiles = readdirSync(root, { withFileTypes: true })
            .filter((e) => e.isFile() && /\.(?:mjs|js)$/.test(e.name))
            .map((e) => join(root, e.name)).sort();
          if (jsFiles.length !== 1) throw new Error('Expected exactly one top-level bundled Worker entrypoint: ' + jsFiles.join(','));
          if (!readFileSync('staging-public/index.html', 'utf8')) throw new Error('Missing or empty staging index');
          cpSync('staging-public', join(root, 'staging-public'), { recursive: true, errorOnExist: true });
          copyFileSync('scripts/live-probes.mjs', join(root, 'evidence-tools/live-probes.mjs'));
          const cfg = JSON.parse(readFileSync('wrangler.staging.jsonc', 'utf8'));
          const configSha256 = createHash('sha256').update(readFileSync('wrangler.staging.jsonc')).digest('hex');
          const sanitizerSha256 = createHash('sha256').update(readFileSync('scripts/sanitize-cloudflare-only-surface.mjs')).digest('hex');
          cfg.main = basename(jsFiles[0]);
          cfg.assets = { ...(cfg.assets || {}), directory: './staging-public', binding: 'ASSETS' };
          cfg.routes = [];
          cfg.workers_dev = true;
          delete cfg.route;
          writeFileSync(join(root, 'wrangler.deploy.jsonc'), JSON.stringify(cfg, null, 2) + '\n');
          const sha = (file) => createHash('sha256').update(readFileSync(file)).digest('hex');
          const files = [];
          const walk = (dir) => {
            for (const e of readdirSync(dir, { withFileTypes: true }).sort((a,b) => a.name.localeCompare(b.name))) {
              const full = join(dir, e.name);
              if (e.isSymbolicLink()) throw new Error('Symlink forbidden: ' + full);
              if (e.isDirectory()) walk(full);
              else if (e.isFile()) files.push({ path: relative(root, full).split(sep).join('/'), bytes: lstatSync(full).size, sha256: sha(full) });
              else throw new Error('Unsupported filesystem entry: ' + full);
            }
          };
          walk(root);
          files.sort((a,b) => a.path.localeCompare(b.path));
          const manifest = { schemaVersion:'1.0', status:'SEALED_NOT_CERTIFIED', sourceCommit:process.env.SOURCE_COMMIT, sanitizerSha256, stagingConfigSha256:configSha256, workerEntrypoint:basename(jsFiles[0]), files };
          writeFileSync(join(root, 'release-manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          const manifestSha256 = sha(join(root, 'release-manifest.json'));
          writeFileSync(join(root, 'release-manifest.sha256'), manifestSha256 + '\n');
          process.stdout.write(JSON.stringify({ sourceCommit:manifest.sourceCommit, sanitizerSha256, stagingConfigSha256:configSha256, workerEntrypoint:manifest.workerEntrypoint, fileCount:files.length, manifestSha256 }) + '\n');
          NODE
          echo "manifest_sha256=$(cat .wrangler-build/release-manifest.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload sealed staging release bundle
        uses: actions/upload-artifact@v4
        with:
          name: lingo-staging-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .wrangler-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/

  cloudflare:
    needs: gates
    if: ${{ inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download sealed release bundle
        uses: actions/download-artifact@v4
        with:
          name: lingo-staging-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .wrangler-build

      - name: Verify manifest digest and every downloaded file
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.gates.outputs.artifact }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.gates.outputs.commit }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { join, relative, sep } from 'node:path';
          const root='.wrangler-build';
          const sha=(p)=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const manifestPath=join(root,'release-manifest.json');
          const digest=sha(manifestPath);
          if(digest!==process.env.EXPECTED_MANIFEST_SHA256) throw new Error('Manifest digest differs from build job output');
          if(readFileSync(join(root,'release-manifest.sha256'),'utf8').trim()!==digest) throw new Error('Detached manifest digest mismatch');
          const m=JSON.parse(readFileSync(manifestPath,'utf8'));
          if(m.status!=='SEALED_NOT_CERTIFIED'||m.sourceCommit!==process.env.EXPECTED_SOURCE_COMMIT) throw new Error('Manifest state/source mismatch');
          if(!/^[a-f0-9]{64}$/.test(m.sanitizerSha256)||!/^[a-f0-9]{64}$/.test(m.stagingConfigSha256)) throw new Error('Missing SHA-256 provenance');
          const expected=new Map(m.files.map(f=>[f.path,f]));
          if(expected.size!==m.files.length) throw new Error('Duplicate manifest paths');
          const actual=[];
          const walk=(dir)=>{for(const e of readdirSync(dir,{withFileTypes:true})){const full=join(dir,e.name);if(e.isSymbolicLink())throw new Error('Symlink forbidden: '+full);if(e.isDirectory())walk(full);else if(e.isFile()){const p=relative(root,full).split(sep).join('/');if(p==='release-manifest.json'||p==='release-manifest.sha256')continue;actual.push(p);const f=expected.get(p);if(!f)throw new Error('Unexpected file: '+p);if(lstatSync(full).size!==f.bytes||sha(full)!==f.sha256)throw new Error('File hash/size mismatch: '+p);}else throw new Error('Unsupported file: '+full);}};
          walk(root);
          if(actual.length!==expected.size||[...expected.keys()].some(p=>!actual.includes(p)))throw new Error('Bundle file set differs from manifest');
          for(const p of ['wrangler.deploy.jsonc','evidence-tools/live-probes.mjs','staging-public/index.html'])if(!expected.has(p))throw new Error('Required file missing: '+p);
          const c=JSON.parse(readFileSync(join(root,'wrangler.deploy.jsonc'),'utf8'));
          if(c.name!=='thelingolegacy-staging'||c.workers_dev!==true||(c.routes||[]).length||c.main!==m.workerEntrypoint||c.assets?.directory!=='./staging-public')throw new Error('Deployment config violates staging isolation');
          console.log(JSON.stringify({status:'PASS',sourceCommit:m.sourceCommit,manifestSha256:digest,fileCount:actual.length,workerEntrypoint:m.workerEntrypoint}));
          NODE

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Deploy the exact verified bundle without rebuilding
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --no-bundle --config .wrangler-build/wrangler.deploy.jsonc 2>&1 | tee wrangler-deploy.log
          VERSION_ID="$(sed -nE 's/.*Current Version ID:[[:space:]]*([[:alnum:]-]+).*/\1/p' wrangler-deploy.log | tail -n 1)"
          test -n "$VERSION_ID" || { echo 'Wrangler did not expose a version ID; staging evidence cannot be accepted'; exit 1; }
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Capture Cloudflare version record and ETag
        id: version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -D .wrangler-build/version-response.headers \
            -o .wrangler-build/version-response.json \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/thelingolegacy-staging/versions/$VERSION_ID"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const response=JSON.parse(readFileSync('.wrangler-build/version-response.json','utf8'));
          if(!response.success||response?.result?.id!==process.env.VERSION_ID)throw new Error('Cloudflare API did not confirm exact version ID');
          const lines=readFileSync('.wrangler-build/version-response.headers','utf8').split(/\r?\n/);
          const line=lines.findLast((v)=>/^etag:/i.test(v));
          const etag=line?.split(':').slice(1).join(':').trim();
          if(!etag)throw new Error('Cloudflare version response did not include ETag');
          writeFileSync('.wrangler-build/version-evidence.json',JSON.stringify({versionId:process.env.VERSION_ID,etag,confirmedByCloudflareApi:true},null,2)+'\n');
          writeFileSync(process.env.GITHUB_OUTPUT,'etag='+etag.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')+'\n',{flag:'a'});
          NODE

      - name: Run staging probes against the deployed version
        id: probes
        shell: bash
        env:
          LIVE_BASE_URL: https://thelingolegacy-staging.thelingolegacy.workers.dev
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: |
          set -euo pipefail
          node .wrangler-build/evidence-tools/live-probes.mjs | tee .wrangler-build/live-probes.json

      - name: Write deployment provenance attestation
        if: always()
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.gates.outputs.commit }}
          MANIFEST_SHA256: ${{ needs.gates.outputs.artifact }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
          VERSION_ETAG: ${{ steps.version.outputs.etag }}
          PROBE_OUTCOME: ${{ steps.probes.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const m=JSON.parse(readFileSync('.wrangler-build/release-manifest.json','utf8'));
          let probes=null;try{probes=JSON.parse(readFileSync('.wrangler-build/live-probes.json','utf8'));}catch{}
          const a={schemaVersion:'1.0',status:process.env.PROBE_OUTCOME==='success'&&Boolean(process.env.VERSION_ID)&&Boolean(process.env.VERSION_ETAG)?'STAGING_DEPLOYED_PROBES_PASS_NOT_CERTIFIED':'BLOCKED_NOT_CERTIFIED',sourceCommit:process.env.SOURCE_COMMIT,sanitizerSha256:m.sanitizerSha256,stagingConfigSha256:m.stagingConfigSha256,bundleManifestSha256:process.env.MANIFEST_SHA256,workerEntrypoint:m.workerEntrypoint,cloudflareVersionId:process.env.VERSION_ID||null,cloudflareEtag:process.env.VERSION_ETAG||null,probeOutcome:process.env.PROBE_OUTCOME||'not_run',probes};
          writeFileSync('.wrangler-build/release-attestation.json',JSON.stringify(a,null,2)+'\n');
          if(a.status==='BLOCKED_NOT_CERTIFIED')process.exitCode=1;
          NODE

      - name: Upload staging deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-staging-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .wrangler-build/release-attestation.json
            .wrangler-build/live-probes.json
            .wrangler-build/version-evidence.json
          if-no-files-found: warn
          retention-days: 30

  production-hold:
    needs: gates
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed before production mutation
        shell: bash
        run: |
          echo "::error::Production promotion is blocked. G02 assignment, independently verified release evidence, and an accepted rollback target are required before production deployment."
          exit 1

  certificate:
    needs: [gates, cloudflare]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production certification boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f config/production.json
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.failClosed)")" = "true"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.requireLiveProbePass)")" = "true"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.requireRollbackTarget)")" = "true"
          echo 'Configured repository and Cloudflare gates passed.'
          echo 'CERTIFIED remains withheld unless live evidence and rollback target are actually present.'
