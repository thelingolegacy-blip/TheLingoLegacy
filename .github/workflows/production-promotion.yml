name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      live_base_url:
        description: Live URL to probe after deployment
        required: false
        default: https://thelingolegacy.com
  push:
    branches: ['production-deploy']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: lingo-legacy-promotion-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Cloudflare binding contract gate
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Dynamic runtime contract gate
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude='./.git' --exclude='./release/evidence' -cf release-artifact.tar .
          echo "artifact=$(sha256sum release-artifact.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: production
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/

  cloudflare:
    needs: gates
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'staging' || inputs.environment == 'production')) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Verify Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Verify Cloudflare binding contract
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Verify dynamic runtime contract
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Verify Wrangler configuration
        run: |
          test -f wrangler.jsonc || { echo 'wrangler.jsonc missing'; exit 1; }
          grep -Eq '"name"\s*:\s*"thelingolegacy"|name\s*[:=]\s*["'"']thelingolegacy'"' wrangler.jsonc || { echo 'Worker name is not thelingolegacy'; exit 1; }
      - name: Verify Cloudflare credentials are injected as secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc
      - name: Live probes
        env:
          LIVE_BASE_URL: https://thelingolegacy.com
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: node scripts/live-probes.mjs

  certificate:
    needs: [gates, cloudflare]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Certification boundary
        run: |
          echo 'Certification boundary reached.'
          echo 'CERTIFIED is withheld until the complete evidence bundle and rollback target are verified.'
