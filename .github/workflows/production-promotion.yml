name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  # Tags do not authorize production mutation. Promotion is explicit via workflow_dispatch.

permissions:
  contents: read

concurrency:
  group: lingo-legacy-promotion-${{ inputs.environment || 'manual' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    # G02 is the authoritative runner boundary. Do not substitute a GitHub-hosted runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 5
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
      runner_id: ${{ steps.assert.outputs.runner_id }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - name: Runner reached execution stage
        id: assert
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" || { echo 'RUNNER_ID missing'; exit 1; }
          test "$RUNNER_ID" != "0" || { echo 'RUNNER_ID is zero'; exit 1; }
          test "$RUNNER_NAME" = "lingo-legacy-g02" || { echo 'RUNNER_NAME mismatch'; exit 1; }
          test "$RUNNER_OS_VALUE" = "Linux" || { echo 'RUNNER_OS missing'; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo 'RUNNER_ARCH mismatch'; exit 1; }
          test -n "$GITHUB_SHA_VALUE" || { echo 'GITHUB_SHA missing'; exit 1; }
          echo "RUNNER_GATE=PASS" >> "$GITHUB_OUTPUT"
          echo "runner_id=$RUNNER_ID" >> "$GITHUB_OUTPUT"
          echo "runner_name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"
          echo "G02_RUNNER_ASSIGNMENT=PASS"
          echo "RUNNER_GATE=PASS"
          echo "RUNNER_ID=$RUNNER_ID"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS_VALUE"
          echo "RUNNER_ARCH=$RUNNER_ARCH_VALUE"
          echo "GITHUB_SHA=$GITHUB_SHA_VALUE"
      - name: Runner gate completion assertion
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.assert.outputs.runner_gate }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = "PASS" || { echo 'RUNNER_GATE != PASS'; exit 1; }
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

  gates:
    needs: runner-gate
    if: ${{ needs.runner-gate.outputs.runner_gate == 'PASS' }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Cloudflare binding contract gate
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Production authority-chain gate
        run: node scripts/verify-production-authority.mjs
      - name: Dynamic runtime contract gate
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Wrangler configuration validation
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Validate production promotion contract
        run: node scripts/test-production-promotion-contract.mjs
      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude='./.git' --exclude='./release/evidence' -cf release-artifact.tar .
          echo "artifact=$(sha256sum release-artifact.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs
      - name: Record completed pre-deployment gates
        env:
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
          ROLLBACK_TARGET: ${{ vars.ROLLBACK_TARGET }}
          ROLLBACK_TARGET_VERIFIED: ${{ vars.ROLLBACK_TARGET_VERIFIED }}
          PROMOTION_EVIDENCE_VERIFIED: ${{ vars.PROMOTION_EVIDENCE_VERIFIED }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = `release/evidence/${process.env.RELEASE_ID}`;
          const gatesPath = `${root}/gates.json`;
          const gates = JSON.parse(readFileSync(gatesPath, 'utf8'));
          gates.status = 'PASS';
          gates.commitSha = process.env.COMMIT_SHA;
          gates.criticalGates = [
            'sanitize-cloudflare-only-surface',
            'verify-cloudflare-only',
            'verify-cloudflare-bindings',
            'verify-production-authority',
            'verify-dynamic-runtime',
            'wrangler-dry-run'
          ];
          writeFileSync(gatesPath, JSON.stringify(gates, null, 2) + '\n');
          const rollbackPath = `${root}/rollback.json`;
          const rollback = JSON.parse(readFileSync(rollbackPath, 'utf8'));
          if (process.env.ROLLBACK_TARGET_VERIFIED === 'true' &&
              process.env.PROMOTION_EVIDENCE_VERIFIED === 'true' &&
              process.env.ROLLBACK_TARGET?.trim()) {
            rollback.status = 'PASS';
            rollback.target = process.env.ROLLBACK_TARGET.trim();
            rollback.verification = 'Externally attested through protected repository variables; independent proof must be retained in the evidence ledger.';
          }
          writeFileSync(rollbackPath, JSON.stringify(rollback, null, 2) + '\n');
          const manifestPath = `${root}/manifest.json`;
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          delete manifest.evidenceDigest;
          const names = ['build.json', 'certificate.json', 'commit.json', 'gates.json', 'live-probes.json', 'manifest.json', 'rollback.json'];
          const digest = createHash('sha256');
          for (const name of names) {
            const value = name === 'manifest.json' ? manifest : JSON.parse(readFileSync(`${root}/${name}`, 'utf8'));
            digest.update(name + '\\n' + JSON.stringify(value) + '\\n');
          }
          manifest.evidenceDigest = digest.digest('hex');
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Upload pre-deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-predeploy-evidence-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error

  predeployment-authorization:
    needs: gates
    if: ${{ needs.gates.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: lingo-predeploy-evidence-${{ github.run_id }}
          path: release/evidence/
      - name: Verify release identity, evidence, and rollback readiness
        env:
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PROMOTION_EVIDENCE_VERIFIED: ${{ vars.PROMOTION_EVIDENCE_VERIFIED }}
          ROLLBACK_TARGET_VERIFIED: ${{ vars.ROLLBACK_TARGET_VERIFIED }}
        run: |
          set -euo pipefail
          test "$PROMOTION_EVIDENCE_VERIFIED" = "true" || { echo 'Promotion evidence has not been independently verified'; exit 1; }
          test "$ROLLBACK_TARGET_VERIFIED" = "true" || { echo 'Rollback target has not been independently verified'; exit 1; }
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const root = `release/evidence/${process.env.RELEASE_ID}`;
          const manifest = JSON.parse(readFileSync(`${root}/manifest.json`, 'utf8'));
          const recordedDigest = manifest.evidenceDigest;
          delete manifest.evidenceDigest;
          const names = ['build.json', 'certificate.json', 'commit.json', 'gates.json', 'live-probes.json', 'manifest.json', 'rollback.json'];
          const digest = createHash('sha256');
          for (const name of names) {
            const value = name === 'manifest.json' ? manifest : JSON.parse(readFileSync(`${root}/${name}`, 'utf8'));
            digest.update(name + '\\n' + JSON.stringify(value) + '\\n');
          }
          if (digest.digest('hex') !== recordedDigest) throw new Error('Pre-deployment evidence digest mismatch');
          manifest.evidenceDigest = recordedDigest;
          const gates = JSON.parse(readFileSync(`${root}/gates.json`, 'utf8'));
          const rollback = JSON.parse(readFileSync(`${root}/rollback.json`, 'utf8'));
          if (manifest.commitSha !== process.env.EXPECTED_COMMIT) throw new Error('Evidence commit does not match dispatched commit');
          if (manifest.certificationStatus !== 'NOT_CERTIFIED') throw new Error('Unexpected pre-deployment certification state');
          if (gates.status !== 'PASS' || gates.commitSha !== process.env.EXPECTED_COMMIT) throw new Error('Required pre-deployment gates are not recorded as passing');
          if (rollback.status !== 'PASS' || !rollback.target) throw new Error('Verified rollback target evidence is missing');
          console.log('PRE_DEPLOYMENT_AUTHORIZATION=PASS');
          console.log(`COMMIT=${manifest.commitSha}`);
          console.log(`ROLLBACK_TARGET=${rollback.target}`);
          NODE

  cloudflare:
    needs: [gates, predeployment-authorization]
    if: ${{ needs.predeployment-authorization.result == 'success' && (inputs.environment == 'staging' || inputs.environment == 'production') }}
    runs-on: ubuntu-latest
    # Configure required reviewers and deployment protection rules on each environment.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: lingo-predeploy-evidence-${{ github.run_id }}
          path: release/evidence/
      - name: Re-run repository production gates
        run: |
          set -euo pipefail
          node scripts/sanitize-cloudflare-only-surface.mjs
          node scripts/verify-cloudflare-only.mjs
          node scripts/verify-cloudflare-bindings.mjs
          node scripts/verify-production-authority.mjs
          node scripts/verify-dynamic-runtime.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Resolve canonical production URL
        id: config
        shell: bash
        run: |
          set -euo pipefail
          domain=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).canonicalDomain)")
          echo "base_url=https://${domain}" >> "$GITHUB_OUTPUT"
      - name: Run and preserve live probes
        env:
          LIVE_BASE_URL: ${{ steps.config.outputs.base_url }}
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: |
          set -euo pipefail
          mkdir -p release/evidence/post-deployment
          node scripts/live-probes.mjs | tee release/evidence/post-deployment/live-probes.json
      - name: Upload post-deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-postdeploy-evidence-${{ github.run_id }}
          path: release/evidence/post-deployment/
          if-no-files-found: error

  certificate:
    needs: [gates, predeployment-authorization, cloudflare]
    if: ${{ success() && needs.predeployment-authorization.result == 'success' && needs.cloudflare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: lingo-predeploy-evidence-${{ github.run_id }}
          path: release/evidence/
      - uses: actions/download-artifact@v4
        with:
          name: lingo-postdeploy-evidence-${{ github.run_id }}
          path: release/evidence/post-deployment/
      - name: Independent post-deployment acceptance
        env:
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PROMOTION_EVIDENCE_VERIFIED: ${{ vars.PROMOTION_EVIDENCE_VERIFIED }}
          ROLLBACK_TARGET_VERIFIED: ${{ vars.ROLLBACK_TARGET_VERIFIED }}
        run: |
          set -euo pipefail
          test "$PROMOTION_EVIDENCE_VERIFIED" = "true" || { echo 'Promotion evidence verification attestation missing'; exit 1; }
          test "$ROLLBACK_TARGET_VERIFIED" = "true" || { echo 'Rollback verification attestation missing'; exit 1; }
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = `release/evidence/${process.env.RELEASE_ID}`;
          const manifestPath = `${root}/manifest.json`;
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const recordedDigest = manifest.evidenceDigest;
          delete manifest.evidenceDigest;
          const names = ['build.json', 'certificate.json', 'commit.json', 'gates.json', 'live-probes.json', 'manifest.json', 'rollback.json'];
          const digest = createHash('sha256');
          for (const name of names) {
            const value = name === 'manifest.json' ? manifest : JSON.parse(readFileSync(`${root}/${name}`, 'utf8'));
            digest.update(name + '\\n' + JSON.stringify(value) + '\\n');
          }
          if (digest.digest('hex') !== recordedDigest) throw new Error('Pre-acceptance evidence digest mismatch');
          manifest.evidenceDigest = recordedDigest;
          const gates = JSON.parse(readFileSync(`${root}/gates.json`, 'utf8'));
          const rollback = JSON.parse(readFileSync(`${root}/rollback.json`, 'utf8'));
          const probes = JSON.parse(readFileSync('release/evidence/post-deployment/live-probes.json', 'utf8'));
          if (manifest.commitSha !== process.env.EXPECTED_COMMIT) throw new Error('Release evidence commit mismatch');
          if (gates.status !== 'PASS' || gates.commitSha !== process.env.EXPECTED_COMMIT) throw new Error('Pre-deployment gates not accepted');
          if (rollback.status !== 'PASS' || !rollback.target) throw new Error('Rollback readiness evidence missing');
          if (probes.status !== 'PASS' || !Array.isArray(probes.probes) || probes.probes.length === 0 || probes.probes.some(p => p.status !== 'PASS')) throw new Error('Live probe acceptance failed');
          const certificate = {
            releaseId: manifest.releaseId,
            commitSha: manifest.commitSha,
            environment: manifest.environment,
            acceptedAt: new Date().toISOString(),
            status: 'ACCEPTED',
            liveProbeStatus: probes.status,
            rollbackTarget: rollback.target,
            evidence: 'Pre-deployment gates, commit correlation, externally verified rollback attestation, and post-deployment live probes passed.'
          };
          writeFileSync(`${root}/certificate.json`, JSON.stringify(certificate, null, 2) + '\n');
          delete manifest.evidenceDigest;
          const refreshedDigest = createHash('sha256');
          for (const name of names) {
            const value = name === 'manifest.json' ? manifest : JSON.parse(readFileSync(`${root}/${name}`, 'utf8'));
            refreshedDigest.update(name + '\\n' + JSON.stringify(value) + '\\n');
          }
          manifest.evidenceDigest = refreshedDigest.digest('hex');
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log('POST_DEPLOYMENT_ACCEPTANCE=PASS');
          console.log('CERTIFICATION=ACCEPTED');
          NODE
