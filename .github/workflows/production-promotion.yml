name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      live_base_url:
        description: Live URL to probe after deployment
        required: false
        default: https://thelingolegacy.com
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: lingo-legacy-promotion-${{ inputs.environment || 'tag' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs

      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs

      - name: Static site validation
        run: |
          if [ -f scripts/validate-static-site.mjs ]; then
            node scripts/validate-static-site.mjs
          else
            echo 'Static validator not present; critical gate is NOT_RUN.'
            exit 1
          fi

      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude='./.git' --exclude='./release/evidence' -cf release-artifact.tar .
          echo "artifact=$(sha256sum release-artifact.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs

      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/

  cloudflare:
    needs: gates
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.environment == 'staging' || inputs.environment == 'production')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs

      - name: Verify Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs

      - name: Verify Wrangler configuration
        run: |
          test -f wrangler.jsonc || { echo 'wrangler.jsonc missing'; exit 1; }
          grep -Eq '"name"\s*:\s*"thelingolegacy"|name\s*[:=]\s*["'"']thelingolegacy'"' wrangler.jsonc || { echo 'Worker name is not thelingolegacy'; exit 1; }

      - name: Verify Cloudflare credentials are injected as secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Live probes
        env:
          LIVE_BASE_URL: ${{ inputs.live_base_url || 'https://thelingolegacy.com' }}
        run: node scripts/live-probes.mjs

  certificate:
    needs: [gates, cloudflare]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Certification boundary
        run: |
          echo 'Cloudflare deployment and live probes passed.'
          echo 'Final certificate generation requires the complete evidence bundle and rollback target.'
          echo 'No automatic CERTIFIED state is emitted without those artifacts.'
