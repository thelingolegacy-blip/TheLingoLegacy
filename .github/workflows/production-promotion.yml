name: Lingo Legacy Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  # Tags do not authorize production mutation. Production promotion is explicit via workflow_dispatch.

permissions:
  contents: read
  actions: read

concurrency:
  group: lingo-legacy-promotion-${{ inputs.environment || 'manual' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    # G02 is the authoritative runner boundary. Never substitute a hosted runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
      runner_id: ${{ steps.assert.outputs.runner_id }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - name: Runner reached execution stage
        id: assert
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS_VALUE"
          test -n "$RUNNER_ARCH_VALUE"
          test -n "$GITHUB_SHA_VALUE"

          JOBS_JSON="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          RUNNER_ID="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-gate") | .runner_id' | head -n1)"
          API_RUNNER_NAME="$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="runner-gate") | .runner_name' | head -n1)"

          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "null"
          test "$RUNNER_ID" -gt 0
          test -n "$API_RUNNER_NAME"
          test "$API_RUNNER_NAME" != "null"
          test "$API_RUNNER_NAME" = "$RUNNER_NAME"

          echo "runner_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "runner_id=$RUNNER_ID" >> "$GITHUB_OUTPUT"
          echo "runner_name=$API_RUNNER_NAME" >> "$GITHUB_OUTPUT"
          printf 'RUNNER_GATE=PASS\nRUNNER_ID=%s\nRUNNER_NAME=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\nRUNNER_ENVIRONMENT=%s\nGITHUB_SHA=%s\n'             "$RUNNER_ID" "$API_RUNNER_NAME" "$RUNNER_OS_VALUE" "$RUNNER_ARCH_VALUE" "$RUNNER_ENVIRONMENT" "$GITHUB_SHA_VALUE"

      - name: Runner gate completion assertion
        shell: bash
        env:
          RUNNER_GATE: ${{ steps.assert.outputs.runner_gate }}
        run: |
          set -euo pipefail
          test "$RUNNER_GATE" = "PASS"
          echo "RUNNER_EXECUTION_SENTINEL=PASS"

  gates:
    needs: runner-gate
    if: ${{ needs.runner-gate.outputs.runner_gate == 'PASS' }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sanitize retired provider surface
        run: node scripts/sanitize-cloudflare-only-surface.mjs
      - name: Cloudflare-only runtime gate
        run: node scripts/verify-cloudflare-only.mjs
      - name: Cloudflare binding contract gate
        run: node scripts/verify-cloudflare-bindings.mjs
      - name: Production authority-chain gate
        run: node scripts/verify-production-authority.mjs
      - name: Dynamic runtime contract gate
        run: node scripts/verify-dynamic-runtime.mjs
      - name: Wrangler configuration validation
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude='./.git' --exclude='./release/evidence' -cf release-artifact.tar .
          echo "artifact=$(sha256sum release-artifact.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Generate evidence scaffold
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: LL-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/generate-release-evidence.mjs
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-evidence-${{ github.run_id }}
          path: release/evidence/

  cloudflare:
    needs: gates
    if: ${{ inputs.environment == 'staging' || inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run repository production gates
        run: |
          node scripts/sanitize-cloudflare-only-surface.mjs
          node scripts/verify-cloudflare-only.mjs
          node scripts/verify-cloudflare-bindings.mjs
          node scripts/verify-production-authority.mjs
          node scripts/verify-dynamic-runtime.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Resolve canonical production URL
        id: config
        shell: bash
        run: |
          set -euo pipefail
          domain=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).canonicalDomain)")
          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
      - name: Live probes
        env:
          LIVE_BASE_URL: ${{ steps.config.outputs.base_url }}
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: node scripts/live-probes.mjs

  certificate:
    needs: [gates, cloudflare]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production certification boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f config/production.json
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.failClosed)")" = "true"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.requireLiveProbePass)")" = "true"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).activation.requireRollbackTarget)")" = "true"
          echo 'Configured repository and Cloudflare gates passed.'
          echo 'CERTIFIED remains withheld unless live evidence and rollback target are actually present.'
