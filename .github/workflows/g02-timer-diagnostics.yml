name: G02 Read-Only Timer Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: g02-read-only-timer-diagnostics
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect latest G02 probe without dispatching it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect GitHub-side assignment telemetry
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p g02-timer-evidence
          report="g02-timer-evidence/g02-timer-diagnostics.txt"
          jobs_json="g02-timer-evidence/latest-jobs.json"
          runs_json="g02-timer-evidence/latest-runs.json"
          printf '{"workflow_runs":[]}\n' > "$runs_json"
          printf '{"jobs":[]}\n' > "$jobs_json"
          {
            echo "G02_TIMER_DIAGNOSTICS_VERSION=1"
            echo "CAPTURED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "REPOSITORY=$GH_REPO"
            echo "MODE=READ_ONLY_NO_DISPATCH_NO_PROMOTION"
          } > "$report"

          if ! gh api "repos/$GH_REPO/actions/workflows/g02-qualified-evidence-probe.yml/runs?per_page=10" > "$runs_json.tmp"; then
            echo "G02_DIAGNOSTIC_RESULT=API_QUERY_FAILED" >> "$report"
            echo "G02_ACCEPTANCE=BLOCKED" >> "$report"
          else
          mv "$runs_json.tmp" "$runs_json"
          run_id="$(jq -r '[.workflow_runs[]?] | sort_by(.created_at) | last | .id // empty' "$runs_json")"
          if [ -z "$run_id" ]; then
            echo "G02_DIAGNOSTIC_RESULT=NO_QUALIFIED_PROBE_RUN_FOUND" >> "$report"
            echo "G02_ACCEPTANCE=BLOCKED" >> "$report"
          else
            echo "OBSERVED_RUN_ID=$run_id" >> "$report"
            jq --argjson rid "$run_id" '.workflow_runs[] | select(.id == $rid) | {id,name,status,conclusion,head_sha,created_at,run_attempt}' "$runs_json" > g02-timer-evidence/latest-run-summary.json
            if gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" > "$jobs_json.tmp"; then
              mv "$jobs_json.tmp" "$jobs_json"
              jq '[.jobs[]? | {id,name,status,conclusion,runner_id,runner_name,started_at,completed_at,steps}]' "$jobs_json" > g02-timer-evidence/latest-job-summaries.json
              jq -r '
                [.jobs[]? | select(.name == "qualified-evidence")][0] // empty |
                "JOB_ID=" + ((.id // "")|tostring),
                "JOB_STATUS=" + (.status // "unknown"),
                "JOB_CONCLUSION=" + (.conclusion // "unknown"),
                "RUNNER_ID=" + ((.runner_id // 0)|tostring),
                "RUNNER_NAME=" + (.runner_name // ""),
                "STEPS_COUNT=" + ((.steps // [] | length)|tostring)
              ' "$jobs_json" >> "$report" || true
              if jq -e '[.jobs[]? | select(.name == "qualified-evidence" and (.runner_id // 0) > 0 and .runner_name == "lingo-legacy-g02" and ((.steps // []) | length) > 0 and .status == "completed" and .conclusion == "success")] | length > 0' "$jobs_json" >/dev/null; then
                echo "G02_DIAGNOSTIC_RESULT=ASSIGNED_JOB_SUCCESS_CANDIDATE" >> "$report"
                echo "G02_ACCEPTANCE=REQUIRES_LOG_ARTIFACT_AND_INDEPENDENT_CORRELATION" >> "$report"
              else
                echo "G02_DIAGNOSTIC_RESULT=NO_QUALIFYING_ASSIGNED_SUCCESS" >> "$report"
                echo "G02_ACCEPTANCE=BLOCKED" >> "$report"
              fi
            else
              echo "G02_DIAGNOSTIC_RESULT=JOB_QUERY_FAILED" >> "$report"
              echo "G02_ACCEPTANCE=BLOCKED" >> "$report"
            fi
          fi
          fi

          (cd g02-timer-evidence && sha256sum *.json *.txt > SHA256SUMS)
          cat "$report"
          cat g02-timer-evidence/SHA256SUMS
      - name: Upload read-only diagnostic packet
        uses: actions/upload-artifact@v4
        with:
          name: g02-timer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: g02-timer-evidence/
          if-no-files-found: error
          retention-days: 7
