name: Platform Contract Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ops/architecture/**"
      - "docs/architecture/**"
      - "docs/integrations/google-ai-studio.md"
      - ".github/workflows/platform-contract-validation.yml"

permissions:
  contents: read

concurrency:
  group: platform-contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate JSON contract and fail-closed invariants
        run: node ops/architecture/validate-contract.mjs
      - name: Verify no provider key is committed in the contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']+["'\'']' ops/architecture docs/integrations/google-ai-studio.md; then
            echo "Potential provider key or literal secret found; failing closed."
            exit 1
          fi
          echo "No literal Gemini key detected in architecture contract."
