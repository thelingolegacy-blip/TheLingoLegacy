name: LINGO Slot Engine Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "src/server/slot-engine.mjs"
      - "scripts/tests/server-slot-engine.test.mjs"
      - ".github/workflows/slot-engine-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: slot-engine-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slot-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run isolated slot-engine contract suite
        run: npm test
