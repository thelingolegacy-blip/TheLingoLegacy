name: Destiny Engine Core
on:
  pull_request:
    paths:
      - "packages/destiny-engine/**"
      - ".assetsignore"
      - "scripts/verify-asset-publication-scope.mjs"
      - "scripts/test-verify-asset-publication-scope.mjs"
      - ".github/workflows/destiny-engine-core.yml"
  push:
    branches: ["main"]
    paths:
      - "packages/destiny-engine/**"
      - ".assetsignore"
      - "scripts/verify-asset-publication-scope.mjs"
      - "scripts/test-verify-asset-publication-scope.mjs"
      - ".github/workflows/destiny-engine-core.yml"

permissions:
  contents: read

concurrency:
  group: destiny-engine-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test Destiny Engine core
        run: node --test packages/destiny-engine/test/*.test.mjs
      - name: Verify engine source is excluded from public assets
        run: node scripts/verify-asset-publication-scope.mjs
      - name: Test public asset boundary
        run: node --test scripts/test-verify-asset-publication-scope.mjs
