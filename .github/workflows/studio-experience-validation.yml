name: Studio Experience Validation
on:
  pull_request:
    paths: ["studio-sites/experience/**", "studio-sites/config/experience-bible.json", "studio-sites/EXPERIENCE-IMPLEMENTATION-PLAN.md", ".github/workflows/studio-experience-validation.yml"]
  push:
    branches: ["studio/game-experience-completion-2026-10-19"]
    paths: ["studio-sites/experience/**", "studio-sites/config/experience-bible.json", "studio-sites/EXPERIENCE-IMPLEMENTATION-PLAN.md", ".github/workflows/studio-experience-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-experience-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate studio experience (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check studio-sites/experience/experience.js
      - name: Validate studio baseline
        run: node studio-sites/scripts/validate-studio.mjs
      - name: Validate experience coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('studio-sites/config/experience-bible.json','utf8'));
          const e=[];
          if(d.safety?.productionActivationAuthorized!==false)e.push('Production activation must remain disabled');
          if(d.safety?.noWagering!==true||d.safety?.noCashout!==true)e.push('Virtual-only safeguards missing');
          if(d.games.length!==10)e.push('Expected ten worlds');
          const ids=new Set();
          for(const g of d.games){if(ids.has(g.id))e.push('Duplicate id: '+g.id);ids.add(g.id);for(const k of ['title','division','genre','logline','setting','mechanic','background'])if(!g[k])e.push(g.id+': missing '+k);if(g.characters?.length!==3)e.push(g.id+': expected three characters');if(g.chapters?.length!==2)e.push(g.id+': expected two chapters');if(g.missions?.length!==3)e.push(g.id+': expected three missions');if(g.sound?.length!==4)e.push(g.id+': expected four sound cues')}
          if(d.games.filter(g=>g.division==='LINGOarcade').length!==5)e.push('Expected five arcade worlds');
          if(d.games.filter(g=>g.division==='LINGOslots').length!==5)e.push('Expected five slots titles');
          if(e.length){console.error(e.join('\\n'));process.exit(1)}
          console.log('PASS: ten worlds, character/story/mission/audio coverage and virtual-only safeguards.')
          NODE
