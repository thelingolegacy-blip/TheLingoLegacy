name: LINGO CORE V2 API

on:
  pull_request:
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-api.yml"
  push:
    branches:
      - "implementation/lingo-core-v2-foundation"
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-api.yml"

permissions:
  contents: read

concurrency:
  group: lingo-core-v2-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API validation (hosted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lingo_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: platform/lingo-core-v2/services/api
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: platform/lingo-core-v2/services/api/go.mod
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"
      - name: Verify dependency manifest
        run: go mod tidy -diff
      - name: Test (unit and PostgreSQL integration) with coverage profile
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee go-test-coverage.log
      - name: Summarize function coverage
        if: always() && hashFiles('platform/lingo-core-v2/services/api/coverage.out') != ''
        shell: bash
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tee coverage-summary.txt
      - name: Upload Go coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingo-core-v2-go-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform/lingo-core-v2/services/api/coverage.out
            platform/lingo-core-v2/services/api/go-test-coverage.log
            platform/lingo-core-v2/services/api/coverage-summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
