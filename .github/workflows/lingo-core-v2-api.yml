name: LINGO CORE V2 API

on:
  pull_request:
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-api.yml"
  push:
    branches:
      - "implementation/lingo-core-v2-foundation"
    paths:
      - "platform/lingo-core-v2/**"
      - ".github/workflows/lingo-core-v2-api.yml"

permissions:
  contents: read

concurrency:
  group: lingo-core-v2-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API validation (hosted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/lingo-core-v2/services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: platform/lingo-core-v2/services/api/go.mod
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"
      - name: Verify dependency manifest
        run: go mod tidy -diff
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
