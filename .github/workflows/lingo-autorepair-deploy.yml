name: Lingo Legacy Full-Stack Auto Repair + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Run production deployment after all repair and QA gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: lingo-legacy-full-stack-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
    steps:
      - name: Prove executable GitHub runner
        id: assert
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          echo "runner_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "RUNNER_GATE=PASS runner_id=$RUNNER_ID runner_name=$RUNNER_NAME"

  repair:
    needs: runner-gate
    if: needs.runner-gate.outputs.runner_gate == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run canonical deterministic auto-repair artifact
        run: node scripts/lingo-autorepair.mjs
      - name: Run repository production gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sanitize-cloudflare-only-surface.mjs
          node scripts/verify-cloudflare-only.mjs
          node scripts/verify-cloudflare-bindings.mjs
          node scripts/verify-production-authority.mjs
          node scripts/verify-dynamic-runtime.mjs
          node scripts/validate-static-site.mjs
          node scripts/smoke-static-site.mjs
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Run Node tests when defined
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
              npm test
            else
              echo 'No executable Node test script declared; no test result is fabricated.'
            fi
          else
            echo 'No Node package manifest; static repository gates remain authoritative.'
          fi
      - name: Run Flutter checks when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          else
            echo 'No Flutter project in this repository; no Flutter source was fabricated.'
          fi
      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-full-stack-auto-repair-${{ github.run_id }}
          path: release/evidence/lingo-autorepair-report.json
          if-no-files-found: error

  deploy-cloudflare:
    needs: repair
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && success() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p release/evidence
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee release/evidence/cloudflare-deploy.log
      - name: Resolve canonical production URL
        id: config
        shell: bash
        run: |
          set -euo pipefail
          domain=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/production.json','utf8')).canonicalDomain)")
          echo "base_url=https://${domain}" >> "$GITHUB_OUTPUT"
      - name: Live probes
        env:
          LIVE_BASE_URL: ${{ steps.config.outputs.base_url }}
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: node scripts/live-probes.mjs
      - name: Record deployment verification evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "release_id=LL-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "provider=cloudflare"
            echo "deployment_step=PASS"
            echo "live_probe_step=PASS"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/evidence/deployment-verification.txt
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error

  deploy-firebase:
    needs: repair
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && success() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Determine Firebase surface
        id: firebase
        shell: bash
        run: |
          if [ -f firebase.json ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install Firebase CLI
        if: steps.firebase.outputs.present == 'true'
        run: npm install --global firebase-tools
      - name: Deploy Firebase surface
        if: steps.firebase.outputs.present == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --non-interactive --token "$FIREBASE_TOKEN"
      - name: Record Firebase not-present state
        if: steps.firebase.outputs.present != 'true'
        run: |
          mkdir -p release/evidence
          echo "firebase_surface=NOT_PRESENT" > release/evidence/firebase-verification.txt
          echo "deployment_not_attempted=true" >> release/evidence/firebase-verification.txt
      - name: Upload Firebase evidence
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deployment-evidence-${{ github.run_id }}
          path: release/evidence/firebase-verification.txt
          if-no-files-found: error

  certification:
    needs: [runner-gate, repair, deploy-cloudflare, deploy-firebase]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Certification boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_GATE=PASS"
          echo "REPAIR_GATE=PASS"
          echo "DEPLOYMENT_JOBS=PASS"
          echo "LIVE_PROBES=PASS"
          echo "CERTIFICATION=WITHHELD"
          echo "Reason: independent rollback-target evidence and an immutable release evidence ledger must be assembled before CERTIFIED/ACTIVATED."
