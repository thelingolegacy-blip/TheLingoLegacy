# Canonical production execution workflow: GitHub Actions -> Cloudflare -> live verification
name: Lingo Legacy Full-Stack Auto Repair + Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Run production deployment after repair gates
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: lingo-legacy-full-stack-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    # G02 is the authoritative runner boundary. Do not substitute a GitHub-hosted runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
      runner_id: ${{ steps.assert.outputs.runner_id }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - name: Prove executable GitHub runner and API assignment
        id: assert
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          test -n "$GITHUB_SHA_VALUE"

          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const { GH_TOKEN, RUN_ID, REPOSITORY, RUNNER_NAME, GITHUB_OUTPUT } = process.env;
          if (!GH_TOKEN || !RUN_ID || !REPOSITORY || !GITHUB_OUTPUT) {
            throw new Error('Missing GitHub Actions API verification inputs.');
          }

          const url = `https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100`;
          let verified;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub Actions jobs API returned HTTP ${response.status}.`);
            }
            const payload = await response.json();
            const job = (payload.jobs ?? []).find(item => item.name === 'runner-gate');
            if (job && Number.isSafeInteger(job.runner_id) && job.runner_id > 0) {
              if (job.runner_name !== RUNNER_NAME || job.runner_name !== 'lingo-legacy-g02') {
                throw new Error('GitHub API runner name does not match the expected G02 identity.');
              }
              if (!['in_progress', 'completed'].includes(job.status)) {
                throw new Error(`Unexpected G02 job status: ${job.status}`);
              }
              verified = job;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }

          if (!verified) {
            throw new Error('No positive API-reported runner ID was retrieved for runner-gate.');
          }

          appendFileSync(GITHUB_OUTPUT,
            `runner_gate=PASS\nrunner_id=${verified.runner_id}\nrunner_name=${verified.runner_name}\n`);
          console.log(`G02_RUNNER_ASSIGNMENT=PASS runner_id=${verified.runner_id} runner_name=${verified.runner_name}`);
          NODE

          echo "RUNNER_GATE=PASS runner_name=$RUNNER_NAME runner_os=$RUNNER_OS_VALUE runner_arch=$RUNNER_ARCH_VALUE github_sha=$GITHUB_SHA_VALUE"

  repair:
    needs: runner-gate
    if: needs.runner-gate.outputs.runner_gate == 'PASS'
    # The actual repair and validation workload must execute on the qualified G02 host.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run canonical deterministic auto-repair artifact
        run: node scripts/lingo-autorepair.mjs
      - name: Run repository production gates
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/sanitize-cloudflare-only-surface.mjs scripts/verify-cloudflare-only.mjs scripts/verify-cloudflare-bindings.mjs scripts/verify-production-authority.mjs scripts/verify-dynamic-runtime.mjs scripts/verify-release-config-consistency.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Run Node tests when defined
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test --if-present; else echo 'No npm test script declared.'; fi
          fi
      - name: Run Flutter checks when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          else
            echo 'FLUTTER_SURFACE=NOT_PRESENT — no Flutter source fabricated.'
          fi
      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-full-stack-auto-repair-${{ github.run_id }}
          path: release/evidence/lingo-autorepair-report.json

  deploy-cloudflare:
    needs: repair
    # HARD HOLD: manual input is not acceptance evidence. Keep deployment disabled until independent P/E/V/A acceptance and staging isolation are implemented and verified.
    # HARD HOLD: a manual deploy=true input is not release authorization.
    # Keep Cloudflare production deployment disabled until independent acceptance and staging isolation pass.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Probe canonical production runtime
        env:
          LIVE_BASE_URL: https://thelingolegacy.com
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: |
          if [ -f scripts/live-probes.mjs ]; then node scripts/live-probes.mjs; else echo 'live-probes.mjs missing'; exit 1; fi

  firebase-contract:
    needs: repair
    if: ${{ success() && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Firebase remains contract-only
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.json
          echo 'FIREBASE_DEPLOYMENT=BLOCKED'
          echo 'Firebase is contract-only in the canonical production stack.'
          echo 'No Firebase Hosting/backend mutation is authorized by this workflow.'
          echo 'Use a separately certified Firebase release path only after real project, Auth, App Check, rules, consent, and executable evidence are established.'

  certification:
    needs: [deploy-cloudflare, firebase-contract]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Production certification boundary
        run: |
          set -euo pipefail
          echo 'Cloudflare deployment completed with executable evidence; Firebase remains explicitly contract-only.'
          echo 'Certification may proceed only when live evidence and rollback evidence are present.'
