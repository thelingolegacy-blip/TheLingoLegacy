name: Lingo Legacy Full-Stack Auto Repair + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Run production deployment after repair gates
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  deployments: write

concurrency:
  group: lingo-legacy-full-stack-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
    steps:
      - name: Prove executable GitHub runner
        id: assert
        shell: bash
        env:
          RUNNER_ID: ${{ runner.id }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS_VALUE" = "Linux"
          test -n "$GITHUB_SHA_VALUE"
          echo "runner_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "RUNNER_GATE=PASS runner_id=$RUNNER_ID runner_name=$RUNNER_NAME runner_os=$RUNNER_OS_VALUE github_sha=$GITHUB_SHA_VALUE"

  repair:
    needs: runner-gate
    if: needs.runner-gate.outputs.runner_gate == 'PASS'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run canonical deterministic auto-repair artifact
        run: node scripts/lingo-autorepair.mjs
      - name: Run repository production gates
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/sanitize-cloudflare-only-surface.mjs scripts/verify-cloudflare-only.mjs scripts/verify-cloudflare-bindings.mjs scripts/verify-production-authority.mjs scripts/verify-dynamic-runtime.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Run Node tests when defined
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test --if-present; else echo 'No npm test script declared.'; fi
          fi
      - name: Run Flutter checks when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          else
            echo 'FLUTTER_SURFACE=NOT_PRESENT — no Flutter source fabricated.'
          fi
      - name: Commit deterministic repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/evidence/lingo-autorepair-report.json
          if git diff --cached --quiet; then echo 'No repair evidence changes to commit.'; else git commit -m 'chore(evidence): record full-stack auto-repair result'; git push origin HEAD:main; fi
      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-full-stack-auto-repair-${{ github.run_id }}
          path: release/evidence/lingo-autorepair-report.json

  deploy-cloudflare:
    needs: repair
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy == true) }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Probe canonical production runtime
        env:
          LIVE_BASE_URL: https://thelingolegacy.com
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: |
          if [ -f scripts/live-probes.mjs ]; then node scripts/live-probes.mjs; else echo 'live-probes.mjs missing'; exit 1; fi

  deploy-firebase:
    needs: repair
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy == true) }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Determine Firebase surface
        id: firebase
        shell: bash
        run: |
          if [ -f firebase.json ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install Firebase CLI
        if: steps.firebase.outputs.present == 'true'
        run: npm install --global firebase-tools
      - name: Deploy Firebase surface
        if: steps.firebase.outputs.present == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --non-interactive --token "$FIREBASE_TOKEN"
      - name: Block false Firebase certification
        if: steps.firebase.outputs.present != 'true'
        run: |
          echo 'FIREBASE_DEPLOYMENT=BLOCKED'
          echo 'No firebase.json exists in the canonical repository; Firebase activation cannot be certified.'
          exit 1

  certification:
    needs: [deploy-cloudflare, deploy-firebase]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Production certification boundary
        run: |
          set -euo pipefail
          echo 'Cloudflare and Firebase deployment jobs completed with executable evidence.'
          echo 'Certification may proceed only when live evidence and rollback evidence are present.'
