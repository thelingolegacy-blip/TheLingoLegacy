# Canonical production execution workflow: GitHub Actions -> Cloudflare -> live verification
name: Lingo Legacy Full-Stack Auto Repair + Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Legacy production deployment is frozen; true will fail closed before credentials
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: lingo-legacy-full-stack-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  runner-gate:
    # G02 is the authoritative runner boundary. Do not substitute a GitHub-hosted runner.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    outputs:
      runner_gate: ${{ steps.assert.outputs.runner_gate }}
    steps:
      - name: Prove executable GitHub runner
        id: assert
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          jobs_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/jobs?per_page=100")"
          runner_identity="$(printf '%s' "$jobs_json" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const job = (payload.jobs || []).find(item => item.name === "runner-gate");
              if (!job || job.runner_id == null || !job.runner_name) process.exit(2);
              process.stdout.write(String(job.runner_id) + "\n" + job.runner_name);
            });
          ')" || { echo 'GitHub API did not return an assigned runner identity'; exit 1; }
          RUNNER_ID="$(printf '%s\n' "$runner_identity" | sed -n '1p')"
          RUNNER_NAME="$(printf '%s\n' "$runner_identity" | sed -n '2p')"
          test -n "$RUNNER_ID" && test "$RUNNER_ID" != "0"
          test "$RUNNER_NAME" = "lingo-legacy-g02"
          test "$RUNNER_OS_VALUE" = "Linux"
          test "$RUNNER_ARCH_VALUE" = "X64"
          test -n "$GITHUB_SHA_VALUE"
          echo "runner_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "G02_RUNNER_ASSIGNMENT=PASS"
          echo "RUNNER_GATE=PASS runner_id=$RUNNER_ID runner_name=$RUNNER_NAME runner_os=$RUNNER_OS_VALUE github_sha=$GITHUB_SHA_VALUE"

  repair:
    needs: runner-gate
    if: needs.runner-gate.outputs.runner_gate == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run canonical deterministic auto-repair artifact
        run: node scripts/lingo-autorepair.mjs
      - name: Run repository production gates
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/sanitize-cloudflare-only-surface.mjs scripts/verify-cloudflare-only.mjs scripts/verify-cloudflare-bindings.mjs scripts/verify-production-authority.mjs scripts/verify-dynamic-runtime.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Run Node tests when defined
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test --if-present; else echo 'No npm test script declared.'; fi
          fi
      - name: Run Flutter checks when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          else
            echo 'FLUTTER_SURFACE=NOT_PRESENT — no Flutter source fabricated.'
          fi
      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingo-full-stack-auto-repair-${{ github.run_id }}
          path: release/evidence/lingo-autorepair-report.json

  deploy-cloudflare:
    needs: repair
    if: ${{ success() && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Enforce production mutation freeze
        shell: bash
        run: |
          echo "::error::Production deployment is disabled while G02, staging validation, rollback evidence, and independent release acceptance remain unresolved."
          echo "PRODUCTION_PROMOTION=BLOCKED"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Probe canonical production runtime
        env:
          LIVE_BASE_URL: https://thelingolegacy.com
          LIVE_PROBE_PATHS: /|/healthz|/api/v1/runtime|/api/v1/platform/manifest
        run: |
          if [ -f scripts/live-probes.mjs ]; then node scripts/live-probes.mjs; else echo 'live-probes.mjs missing'; exit 1; fi

  firebase-contract:
    needs: repair
    if: ${{ success() && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Firebase remains contract-only
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.json
          echo 'FIREBASE_DEPLOYMENT=BLOCKED'
          echo 'Firebase is contract-only in the canonical production stack.'
          echo 'No Firebase Hosting/backend mutation is authorized by this workflow.'
          echo 'Use a separately certified Firebase release path only after real project, Auth, App Check, rules, consent, and executable evidence are established.'

  certification:
    needs: [deploy-cloudflare, firebase-contract]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Production certification boundary
        run: |
          set -euo pipefail
          echo 'Cloudflare deployment completed with executable evidence; Firebase remains explicitly contract-only.'
          echo 'Certification may proceed only when live evidence and rollback evidence are present.'
