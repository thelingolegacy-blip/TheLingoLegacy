name: CI/CD Deployment Pipeline & Staging Isolation Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: staging-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-dry-run:
    name: Static Gates → Isolation Audit → Staging Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record Execution Context
        run: |
          node --version
          git rev-parse HEAD
          git status --short

      - name: Run Repository Static Gate Stack
        run: node scripts/run-static-gates.mjs

      - name: Verify Staging Resource Isolation
        run: node scripts/verify-staging-isolation.mjs

      - name: Wrangler Staging Deployment Dry-Run
        run: npx --yes wrangler deploy --config wrangler.staging.jsonc --dry-run

      - name: Upload Static Gate Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            static-gate-results.json
            static-gate-*.log
          if-no-files-found: warn
          retention-days: 14
