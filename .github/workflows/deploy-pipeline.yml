name: CI/CD Deployment Pipeline & Staging Isolation Audit

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-dry-run:
    name: Check → Lint → Build → Isolation Audit → Wrangler Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Staging Resource Isolation
        run: node scripts/verify-staging-isolation.mjs

      - name: Wrangler Staging Deployment Dry-Run
        run: npx wrangler deploy --env staging --dry-run

      - name: Wrangler Production Deployment Dry-Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --dry-run
