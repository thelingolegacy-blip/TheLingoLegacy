services:
  vsm-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingo-vsm-control
    restart: unless-stopped
    networks:
      - default
      - forge-internal
    environment:
      PORT: "8787"
      PREVIEW_PORT: "8788"
      HOST: "0.0.0.0"
      VSM_DATA_DIR: /data
      VSM_WORKSPACE: /workspace
      VSM_OWNER_TOKEN: ${VSM_OWNER_TOKEN:?Set VSM_OWNER_TOKEN in vsm/.env}
      VSM_OWNER_NAME: ${VSM_OWNER_NAME:-Zavione}
      LINGO_ID_HANDLE: ${LINGO_ID_HANDLE:-owner}
      LINGO_ID_DISPLAY_NAME: ${LINGO_ID_DISPLAY_NAME:-LINGO Owner}
      VSM_PROBE_BASE_URL: ${VSM_PROBE_BASE_URL:-https://thelingolegacy.com}
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - vsm-data:/data
      - ..:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  lingo-forge:
    networks:
      - forge-internal
    image: gitea/gitea:1.24.7-rootless
    container_name: lingo-forge
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://127.0.0.1:3000/"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_PRIVATE: "private"
      GITEA__security__INSTALL_LOCK: "false"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:2222"
    volumes:
      - lingo-forge-data:/var/lib/gitea
      - lingo-forge-config:/etc/gitea
    security_opt:
      - no-new-privileges:true

  worker-preview:
    profiles: ["worker-preview"]
    image: node:22-bookworm-slim
    container_name: lingo-worker-preview
    working_dir: /runtime
    restart: "no"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
    command:
      - sh
      - -lc
      - >-
        mkdir -p /runtime &&
        tar -C /source-web --exclude=.git --exclude=node_modules --exclude=.next --exclude=.open-next --exclude='.env*' --exclude='.dev.vars*' -cf - . |
        tar -C /runtime -xf - &&
        npm ci --no-audit --no-fund &&
        npm run cf:preview -- --ip 0.0.0.0 --port 8790 --var ENVIRONMENT:staging
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ${VSM_WEB_REPO_PATH:-../../TheLingoLegacy-Web}:/source-web:ro
      - worker-preview-runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 180s

volumes:
  vsm-data:
    name: lingo-vsm-data
  lingo-forge-data:
    name: lingo-forge-data
  lingo-forge-config:
    name: lingo-forge-config
  worker-preview-runtime:
    name: lingo-worker-preview-runtime

networks:
  forge-internal:
    internal: true
