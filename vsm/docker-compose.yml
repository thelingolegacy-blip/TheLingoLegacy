services:
  vsm-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingo-vsm-control
    restart: unless-stopped
    environment:
      PORT: "8787"\n      PREVIEW_PORT: "8788"
      HOST: "0.0.0.0"
      VSM_DATA_DIR: /data
      VSM_WORKSPACE: /workspace
      VSM_OWNER_TOKEN: ${VSM_OWNER_TOKEN:?Set VSM_OWNER_TOKEN in vsm/.env}
      VSM_OWNER_NAME: ${VSM_OWNER_NAME:-Zavione}
      VSM_PROBE_BASE_URL: ${VSM_PROBE_BASE_URL:-https://thelingolegacy.com}
    ports:
      - "127.0.0.1:8787:8787"\n      - "127.0.0.1:8788:8788"
    volumes:
      - vsm-data:/data
      - ..:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vsm-data:
    name: lingo-vsm-data
