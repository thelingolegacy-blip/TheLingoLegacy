# Example pipeline only. It is not wired to production log sources.
input {
  tcp {
    port => 5044
    codec => json_lines
  }
}
filter {
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}
output {
  stdout {
    codec => json_lines
  }
  # Add an authenticated Elasticsearch output only after secret management,
  # TLS, retention, index lifecycle, and network access are reviewed.
}
