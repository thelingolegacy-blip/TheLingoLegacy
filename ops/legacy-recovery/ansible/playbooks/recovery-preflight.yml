---
# Safe-mode host configuration baseline.
# Run with: ansible-playbook -i inventory/hosts.yml playbooks/recovery-preflight.yml --check --diff
# Explicitly excludes host provisioning, runner registration, service restarts, and production mutations.

- name: LINGO recovery host read-only preflight
  hosts: recovery_runners
  gather_facts: true
  become: false
  any_errors_fatal: true
  tasks:
    - name: Report host identity without secrets
      ansible.builtin.debug:
        msg:
          hostname: "{{ ansible_hostname | default('unknown') }}"
          system: "{{ ansible_system | default('unknown') }}"
          architecture: "{{ ansible_architecture | default('unknown') }}"
          distribution: "{{ ansible_distribution | default('unknown') }}"
          version: "{{ ansible_distribution_version | default('unknown') }}"

    - name: Check Docker CLI availability
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Check Compose plugin availability
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false
      failed_when: false

    - name: Check runner process without reading environment values
      ansible.builtin.shell: "pgrep -af 'Runner.Listener' | sed -E 's/(--token|TOKEN|PASSWORD|SECRET)[ =]+[^ ]+/\1=[REDACTED]/Ig' || true"
      args:
        executable: /bin/bash
      register: runner_process
      changed_when: false
      failed_when: false
      no_log: false

    - name: Report preflight capability status
      ansible.builtin.debug:
        msg:
          docker_cli: "{{ docker_version.rc == 0 }}"
          compose_plugin: "{{ compose_version.rc == 0 }}"
          runner_listener_seen: "{{ runner_process.stdout | length > 0 }}"
          next_step: "Human-reviewed host inventory and duplicate-runner check; no registration performed."
