schema_version: "1.0"

workflow:
  id: "g02-runner-validation"
  name: "G02 Runner Validation"
  purpose: "Validate the exact self-hosted runner execution path without establishing G02 by configuration alone."

  runner:
    name: "lingo-legacy-g02"
    labels:
      - "self-hosted"
      - "linux"
      - "x64"
      - "lingo-g02"

  jobs:
    - id: "allocation"
      purpose: "Prove GitHub assigned the job to the intended runner."
      required_evidence:
        - "runner_id > 0"
        - "runner_name = lingo-legacy-g02"

    - id: "identity"
      purpose: "Prove the assigned machine matches the G02 runner contract."
      required_evidence:
        - "Linux"
        - "X64"
        - "exact runner identity"
        - "required labels"

    - id: "host-validation"
      purpose: "Prove the runner can execute commands."
      required_evidence:
        - "shell execution"
        - "filesystem access"
        - "required environment"

    - id: "dependency-validation"
      purpose: "Prove required execution dependencies exist."
      required_evidence:
        - "bash"
        - "curl"
        - "git"
        - "jq"
        - "tar"
        - "zip"
        - "systemctl"

    - id: "docker-validation"
      purpose: "Prove Docker execution where required."
      required_evidence:
        - "Docker CLI"
        - "Docker daemon"
        - "docker run --rm hello-world"

    - id: "sentinel"
      purpose: "Execute the deterministic G02 sentinel."
      required_evidence:
        - "sentinel starts"
        - "sentinel completes"
        - "expected result recorded"

    - id: "evidence-capture"
      purpose: "Produce machine-readable execution evidence."
      required_evidence:
        - "run_id"
        - "job_id"
        - "runner_id"
        - "runner_name"
        - "execution timestamps"
        - "results"

    - id: "artifact-publication"
      purpose: "Preserve evidence for independent inspection."
      required_evidence:
        - "artifact generated"
        - "artifact retrievable"

    - id: "independent-verification"
      purpose: "Verify the complete execution chain outside the executing step."
      required_evidence:
        - "run/job/runner correlation"
        - "instantiated steps"
        - "retrievable logs"
        - "artifact correlation"

  acceptance:
    predicate:
      P1: "REAL MATCHING RUNNER"
      P2: "runner_id > 0"
      P3: "runner_name populated"
      P4: "JOB ASSIGNED"
      P5: "STEPS INSTANTIATED"
      P6: "SENTINEL EXECUTED"
      P7: "LOGS GENERATED"
      P8: "LOGS RETRIEVABLE"
      P9: "INDEPENDENT VERIFICATION"

    rule: "G02_PASS iff P1 AND P2 AND P3 AND P4 AND P5 AND P6 AND P7 AND P8 AND P9"

  fail_closed:
    any_false: "BLOCK"
    any_unknown: "BLOCK"
    any_unverified: "BLOCK"
    configuration_is_not_execution: true
    queue_state_is_not_assignment: true
    workflow_existence_is_not_execution: true
    runner_online_idle_is_not_execution: true
    execution_without_verification_is_not_pass: true

  state:
    g02_verified: "NOT_ESTABLISHED_UNLESS_P1_P9_VERIFIED"
    production_authority: "NONE"
