name: lingo_legacy
description: "The Lingo Legacy entertainment-only casino game platform with Flutter mobile app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  # Keep the Android API-21-compatible FlutterFire line used by PR #613.
  # Firebase Core 5.x requires minSdk 24; do not silently raise device requirements.
  firebase_core: 2.32.0
  firebase_database: 10.5.7
  firebase_auth: 4.20.0
  firebase_storage: 11.7.7
  firebase_analytics: 10.10.7
  provider: ^6.1.0
  http: ^1.1.0
  intl: ^0.20.3
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
