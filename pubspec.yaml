name: lingo_legacy
description: "The Lingo Legacy entertainment-only casino game platform with Flutter mobile app"
publish_to: "none"

version: 1.0.0+1

environment:
  # HERE SDK for Flutter requires Dart 3.12.2+ and Flutter 3.44.8+.
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1
  firebase_storage: ^14.0.1
  firebase_analytics: ^13.0.1
  provider: ^6.1.5+1
  http: ^1.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
