stages:
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

yaml-and-ansible-validation:
  stage: validate
  image: python:3.12-slim
  before_script:
    - python -m pip install --no-cache-dir --disable-pip-version-check yamllint==1.37.1 ansible-core==2.18.6
  script:
    - yamllint -s .gitlab-ci.yml .github/workflows/devops-foundation-validation.yml ansible/playbooks/read-only-diagnostics.yml
    - ansible-playbook --syntax-check -i localhost, ansible/playbooks/read-only-diagnostics.yml
  variables:
    GIT_STRATEGY: fetch
  interruptible: true
  timeout: 10 minutes
