<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="LINGO Impact — standalone LINGO arcade action prototype."><title>LINGO Impact</title><style>
:root{color-scheme:dark;--g:#c8a84e;--p:#6d2aa8;--i:#060608}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#241238,#060608 45%);color:#f5f0e7;font-family:system-ui,sans-serif;min-height:100vh}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center}.arena{position:relative;height:min(70vh,620px);min-height:430px;margin-top:18px;border:1px solid #ffffff1f;border-radius:28px;overflow:hidden;background:linear-gradient(#151019,#08080a);box-shadow:0 30px 100px #0008}.arena:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,#6d2aa822,transparent 35%),linear-gradient(transparent 0 88%,#c8a84e12 88%);pointer-events:none}.hud{position:absolute;z-index:5;inset:18px 18px auto;display:flex;gap:10px;justify-content:space-between}.meter{width:240px;height:12px;border:1px solid #ffffff33;border-radius:99px;overflow:hidden;background:#0008}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6d2aa8,#c8a84e);transition:width .2s}.fighter{position:absolute;bottom:90px;width:78px;height:120px;border:2px solid #c8a84e;border-radius:22px 22px 12px 12px;background:linear-gradient(#6d2aa855,#0b0b0d);transition:transform .08s}.player{left:14%}.enemy{right:14%;border-color:#a56cff}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{padding:12px 18px;border:1px solid #ffffff2a;border-radius:12px;background:#ffffff0a;color:#fff;cursor:pointer}.btn.primary{border-color:#c8a84e88;background:#c8a84e18}.status{margin-top:12px;color:#aaa6b0;min-height:24px}@media(max-width:650px){.fighter{width:58px;height:92px}.meter{width:130px}.arena{min-height:390px}}
@media(prefers-reduced-motion:reduce){.fighter,.meter i{transition:none}}
</style></head><body><main><header class="top"><strong>LINGO IMPACT</strong><span>STANDALONE · VIRTUAL ARCADE</span></header><section class="arena" id="arena" tabindex="0"><div class="hud"><div><div>HEALTH</div><div class="meter"><i id="hp"></i></div></div><div style="text-align:right">ROUND <b id="round">1</b><br>SCORE <b id="score">0</b></div></div><div class="fighter player" id="player" aria-label="Player"></div><div class="fighter enemy" id="enemy" aria-label="Opponent"></div></section><div class="controls"><button class="btn primary" data-action="attack">HIT</button><button class="btn" data-action="block">BLOCK</button><button class="btn" data-action="dodge">DODGE</button><button class="btn" data-action="special">SPECIAL</button><button class="btn" data-action="restart">RESTART</button></div><div class="status" id="status">Tap HIT to engage. Keyboard: A attack · B block · D dodge · S special.</div></main><script type="module">
import {haptic,gamepadImpact} from "/games/lingo-nexus/haptics.js";
const state={hp:100,score:0,round:1,enemy:100,blocked:false,lock:false};const $=id=>document.getElementById(id);function render(){$("hp").style.width=state.hp+"%";$("score").textContent=state.score;$("round").textContent=state.round}
function shake(ms=120){$("arena").animate([{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:ms});}
function enemyHit(dmg=12){state.enemy=Math.max(0,state.enemy-dmg);state.score+=dmg*10;haptic("medium");gamepadImpact({duration:40,strong:.65});$("enemy").animate([{transform:"translateX(0)"},{transform:"translateX(24px)"},{transform:"translateX(0)"}],{duration:160});if(state.enemy===0){state.score+=500;haptic("victory");$("status").textContent="WORLD CLEAR — VICTORY";state.round++;setTimeout(()=>{state.enemy=100;render()},900)}}
function playerHit(dmg=12){if(state.blocked){haptic("light");$("status").textContent="BLOCKED — reduced impact";return}state.hp=Math.max(0,state.hp-dmg);haptic(dmg>18?"stun":"hit");gamepadImpact({duration:55,strong:.95});shake(150);$("player").animate([{transform:"translateX(0)"},{transform:"translateX(-24px) scale(.96)"},{transform:"translateX(0)"}],{duration:180});$("status").textContent="HIT — impact feedback engaged";if(state.hp===0){$("status").textContent="KNOCKED OUT — press RESTART";state.lock=true}render()}
function action(a){if(state.lock&&a!=="restart")return;if(a==="restart"){state.hp=100;state.score=0;state.enemy=100;state.lock=false;state.round=1;$("status").textContent="READY";render();return}if(a==="block"){state.blocked=true;$("status").textContent="GUARD UP";haptic("light");setTimeout(()=>state.blocked=false,700);return}if(a==="dodge"){haptic("recoil");$("status").textContent="DODGE";$("player").animate([{transform:"translateX(0)"},{transform:"translateX(-55px)"},{transform:"translateX(0)"}],{duration:220});return}if(a==="attack")enemyHit(12);if(a==="special"){enemyHit(28);haptic("heavy");}setTimeout(()=>{if(state.enemy>0&&Math.random()<.72)playerHit(Math.random()<.2?24:10)},350)}
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));addEventListener("keydown",e=>{if(e.key.toLowerCase()==="a")action("attack");if(e.key.toLowerCase()==="b")action("block");if(e.key.toLowerCase()==="d")action("dodge");if(e.key.toLowerCase()==="s")action("special");if(e.key==="Enter")action("restart")});render();
</script></body></html>
