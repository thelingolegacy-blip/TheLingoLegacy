<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lingo Wash District preview: a static community laundry hub with district map, shift blocks, market, league, board, and friends wallet interactions." />
  <title>Lingo Wash District - Where The City Comes To Wash</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --panel-2: #030712;
      --line: rgba(148, 163, 184, 0.18);
      --sky: #38bdf8;
      --pink: #ec4899;
      --green: #22c55e;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 28rem),
        radial-gradient(circle at top right, rgba(236,72,153,.14), transparent 24rem),
        radial-gradient(circle at bottom, rgba(34,197,94,.10), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .shell { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(2, 6, 23, .92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .85rem 0; }
    .brand { display: flex; align-items: center; gap: .8rem; }
    .logo {
      width: 46px; height: 46px; border-radius: 18px;
      background: linear-gradient(135deg, var(--sky), #6366f1, var(--pink));
      display: grid; place-items: center; color: #020617; font-size: 1.55rem; font-weight: 900;
      box-shadow: 0 0 28px rgba(56,189,248,.25);
    }
    h1 { margin: 0; font-size: clamp(1.05rem, 3vw, 1.45rem); letter-spacing: -.03em; }
    .brand p { margin: .1rem 0 0; color: var(--muted); font-size: .75rem; }
    .wash { color: var(--sky); } .district { color: var(--pink); }
    .wallets { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; justify-content: flex-end; }
    .wallet, .zone-select {
      background: rgba(15, 23, 42, .88);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      padding: .55rem .75rem;
      font-size: .8rem;
      font-weight: 800;
    }
    .wallet.coins { color: var(--amber); border-color: rgba(245,158,11,.35); }
    .wallet.cash { color: var(--green); border-color: rgba(34,197,94,.35); }
    nav { position: sticky; top: 74px; z-index: 19; background: rgba(2, 6, 23, .94); border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tabs { display: flex; gap: .45rem; padding: .55rem 0; min-width: max-content; }
    .tab {
      border: 1px solid transparent; color: var(--muted); background: transparent;
      padding: .65rem .85rem; border-radius: 14px; font-size: .78rem; font-weight: 850;
    }
    .tab.active { color: var(--sky); border-color: rgba(56,189,248,.35); background: rgba(56,189,248,.10); box-shadow: 0 0 24px rgba(56,189,248,.12); }
    main { padding: 1.35rem 0 3rem; }
    .hero, .card {
      background: linear-gradient(145deg, rgba(15,23,42,.94), rgba(3,7,18,.98));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.30);
    }
    .hero { padding: 1.4rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center; margin-bottom: 1.25rem; }
    .eyebrow { color: var(--sky); font-size: .74rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 900; }
    h2 { margin: .35rem 0; font-size: clamp(1.45rem, 5vw, 2.25rem); letter-spacing: -.04em; }
    .hero p, .muted { color: var(--muted); font-size: .86rem; line-height: 1.6; }
    .badge { display: inline-flex; border-radius: 999px; border: 1px solid var(--line); padding: .45rem .7rem; font-size: .76rem; font-weight: 900; color: var(--sky); background: rgba(56,189,248,.08); white-space: nowrap; }
    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card { padding: 1rem; transition: transform .18s ease, border-color .18s ease; }
    .card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,.42); }
    .card-title { margin: 0 0 .35rem; font-size: .98rem; }
    .micro { font-size: .72rem; color: var(--muted); }
    .status { color: var(--green); font-size: .68rem; font-weight: 900; border: 1px solid rgba(34,197,94,.35); background: rgba(34,197,94,.08); border-radius: 999px; padding: .25rem .45rem; }
    .map-wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; }
    .map {
      min-height: 420px; position: relative; overflow: hidden; border-radius: 24px; border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px) 0 0 / 46px 46px,
        linear-gradient(0deg, rgba(148,163,184,.05) 1px, transparent 1px) 0 0 / 46px 46px,
        radial-gradient(circle at 50% 45%, rgba(56,189,248,.18), transparent 18rem), #030712;
    }
    .route { position: absolute; left: 12%; right: 10%; top: 51%; height: 3px; background: linear-gradient(90deg, transparent, var(--sky), var(--pink), transparent); transform: rotate(-8deg); opacity: .85; }
    .pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #08111f; border: 2px solid var(--sky); box-shadow: 0 0 24px rgba(56,189,248,.35); font-weight: 900; color: var(--sky); }
    .pin.pink { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 24px rgba(236,72,153,.35); }
    .pin.green { border-color: var(--green); color: var(--green); box-shadow: 0 0 24px rgba(34,197,94,.35); }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .btn {
      border: 0; border-radius: 14px; padding: .72rem .95rem; font-size: .78rem; font-weight: 950;
      background: var(--sky); color: #03101a; box-shadow: 0 12px 28px rgba(56,189,248,.20);
    }
    .btn.green { background: var(--green); color: #021309; box-shadow: 0 12px 28px rgba(34,197,94,.20); }
    .btn.pink { background: var(--pink); color: white; box-shadow: 0 12px 28px rgba(236,72,153,.20); }
    .btn.amber { background: var(--amber); color: #140b02; box-shadow: 0 12px 28px rgba(245,158,11,.20); }
    .btn.ghost { background: rgba(15,23,42,.9); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
    .feed { display: grid; gap: .8rem; }
    textarea { width: 100%; min-height: 82px; resize: vertical; background: #020617; color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: .9rem; }
    .slot { display: grid; grid-template-columns: repeat(3, 1fr); gap: .85rem; margin: 1rem 0; }
    .reel { min-height: 112px; display: grid; place-items: center; font-size: 3rem; border-radius: 18px; background: #020617; border: 1px solid rgba(245,158,11,.35); }
    .spin { animation: pop .16s ease-in-out infinite alternate; }
    @keyframes pop { from { transform: translateY(0) scale(.96); filter: blur(1px); } to { transform: translateY(-4px) scale(1.02); filter: blur(0); } }
    footer { color: var(--muted); border-top: 1px solid var(--line); padding: 1.4rem 0; font-size: .78rem; text-align: center; }
    @media (max-width: 860px) {
      .topbar-inner, .hero { align-items: flex-start; flex-direction: column; }
      nav { top: 127px; }
      .map-wrap, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .wallets { justify-content: flex-start; }
      .zone-select { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand" onclick="setTab('map')" role="button" tabindex="0">
        <div class="logo">💧</div>
        <div>
          <h1>LINGO <span class="wash">WASH</span> <span class="district">DISTRICT</span></h1>
          <p>Where the city comes to wash • Preview community utility lane</p>
        </div>
      </div>
      <div class="wallets">
        <select id="zone" class="zone-select" aria-label="District zone" onchange="setZone(this.value)">
          <option value="all">All District Zones</option>
          <option value="center">Center Lingo</option>
          <option value="north">North Lingo</option>
          <option value="west">West Lingo</option>
          <option value="south">South Lingo</option>
          <option value="northeast">Lingo Northeast</option>
          <option value="bridgeton">Lingo Bridgeton 08302</option>
          <option value="vineland">Lingo Vineland</option>
          <option value="cumberland">Lingo Cumberland</option>
          <option value="millville">Lingo Millville</option>
        </select>
        <div class="wallet coins">🪙 <span id="coins-val">250</span></div>
        <div class="wallet cash">💵 <span id="cash-val">$65.00</span></div>
      </div>
    </div>
  </header>

  <nav>
    <div class="shell tabs" id="tabs"></div>
  </nav>

  <main class="shell" id="app"></main>

  <footer class="shell">
    Lingo Wash District preview route. Wallet, posts, shifts, and mini-game state are stored locally in the browser for this static prototype.
  </footer>

  <script>
    const tabs = [
      ['map', 'District Map'], ['community', 'Community Lane'], ['premium', 'Premium Lane'], ['market', 'Lingo Market'],
      ['league', 'Lingo League'], ['board', 'Lingo Board'], ['friends', 'Lingo Friends']
    ];
    const hubs = [
      { id: 'hub-1', zone: 'center', name: 'Center Lingo Hub A', washers: 12, dryers: 10, x: 49, y: 42, tone: 'sky' },
      { id: 'hub-2', zone: 'north', name: 'North Lingo Hub B', washers: 8, dryers: 8, x: 47, y: 25, tone: 'green' },
      { id: 'hub-3', zone: 'west', name: 'West Lingo Hub C', washers: 10, dryers: 12, x: 35, y: 47, tone: 'pink' },
      { id: 'hub-4', zone: 'south', name: 'South Lingo Hub D', washers: 6, dryers: 6, x: 51, y: 62, tone: 'sky' },
      { id: 'hub-5', zone: 'northeast', name: 'Lingo Northeast Express', washers: 14, dryers: 14, x: 69, y: 31, tone: 'green' },
      { id: 'hub-6', zone: 'bridgeton', name: 'Lingo Bridgeton 08302 Hub', washers: 10, dryers: 10, x: 44, y: 78, tone: 'pink' },
      { id: 'hub-7', zone: 'vineland', name: 'Lingo Vineland Hub', washers: 8, dryers: 8, x: 62, y: 82, tone: 'sky' },
      { id: 'hub-8', zone: 'cumberland', name: 'Lingo Cumberland Hub', washers: 6, dryers: 8, x: 34, y: 86, tone: 'green' },
      { id: 'hub-9', zone: 'millville', name: 'Lingo Millville Station', washers: 8, dryers: 8, x: 70, y: 88, tone: 'pink' }
    ];
    const shifts = [
      ['sb1', '6:00 AM – 9:00 AM', 60], ['sb2', '9:00 AM – 12:00 PM', 60], ['sb3', '12:00 PM – 3:00 PM', 60],
      ['sb4', '3:00 PM – 6:00 PM', 60], ['sb5', '6:00 PM – 9:00 PM', 60], ['sb6', '9:00 PM – 12:00 AM', 85]
    ];
    const products = [
      ['Eco-Pod Detergent 30 Pack', 120, 12.50, '📦'], ['Ultra-Soft Fabric Sheets', 60, 6.00, '✨'],
      ['Heavy Duty Laundry Duffel', 150, 18.00, '🧺'], ['District Hydro-Bottle 32 oz', 200, 22.00, '🥤']
    ];
    const defaultPosts = [
      { user: 'Devontray H.', role: 'District Lead', message: 'Welcome to Lingo Wash District. Center and Bridgeton hubs are staged for 24/7 community wash access.', time: Date.now() - 3600000 },
      { user: 'Kisha M.', role: 'Community Partner', message: 'Shoutout to the 3:00 PM West Lingo Hub team. Cleanest fold batch of the week.', time: Date.now() - 7200000 }
    ];
    const friends = [
      ['Marcus Vance', 'North Lingo', 'On Shift at Hub B', true], ['Elena Rostova', 'Lingo Bridgeton', 'Browsing Market', true], ['Derrick Reed', 'South Lingo', 'Offline', false]
    ];
    const fallbackState = { tab: 'map', zone: 'all', coins: 250, cash: 65, claimed: [], posts: defaultPosts };
    function loadState() {
      try {
        const stored = JSON.parse(localStorage.getItem('lingoWashState') || 'null');
        if (!stored || !Array.isArray(stored.claimed) || !Array.isArray(stored.posts)) return { ...fallbackState };
        return { ...fallbackState, ...stored };
      } catch (err) {
        localStorage.removeItem('lingoWashState');
        return { ...fallbackState };
      }
    }
    const state = loadState();
    function save() { localStorage.setItem('lingoWashState', JSON.stringify(state)); updateWallet(); }
    function updateWallet() {
      document.getElementById('coins-val').textContent = state.coins;
      document.getElementById('cash-val').textContent = '$' + state.cash.toFixed(2);
    }
    function setTab(tab) { state.tab = tab; save(); render(); }
    function setZone(zone) { state.zone = zone; save(); render(); }
    function activeHubs() { return state.zone === 'all' ? hubs : hubs.filter(function(h){ return h.zone === state.zone; }); }
    function hero(eyebrow, title, body, badge) {
      return '<section class="hero"><div><div class="eyebrow">' + eyebrow + '</div><h2>' + title + '</h2><p>' + body + '</p></div><span class="badge">' + badge + '</span></section>';
    }
    function renderTabs() {
      document.getElementById('tabs').innerHTML = tabs.map(function(t){
        return '<button class="tab ' + (state.tab === t[0] ? 'active' : '') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
      }).join('');
      document.getElementById('zone').value = state.zone;
    }
    function renderMap() {
      const list = activeHubs();
      const pins = list.map(function(h){
        const cls = h.tone === 'pink' ? 'pink' : h.tone === 'green' ? 'green' : '';
        return '<button class="pin ' + cls + '" style="left:' + h.x + '%;top:' + h.y + '%" title="' + h.name + '">✦</button>';
      }).join('');
      const cards = list.map(function(h){
        return '<article class="card"><div style="display:flex;justify-content:space-between;gap:.5rem"><h3 class="card-title">' + h.name + '</h3><span class="status">ONLINE</span></div><p class="micro">' + h.washers + ' washers • ' + h.dryers + ' dryers • Zone: ' + h.zone + '</p></article>';
      }).join('');
      return hero('District Infrastructure Grid', 'Interactive Lingo Zone Nodes', 'Connect Philadelphia and South Jersey with smart laundry hubs, local shifts, market supplies, and neighbor support.', list.length + ' Active Nodes') +
        '<section class="map-wrap"><div><div class="map"><div class="route"></div>' + pins + '</div><p class="micro">Center City • North • West • South • Bridgeton • Vineland • Cumberland • Millville</p></div><div class="grid">' + cards + '</div></section>';
    }
    function renderCommunity() {
      return hero('Lingo Community Lane', '3-Hour Shift Blocks & Coins', 'Serve community hubs, assist neighbors, and earn local preview Coins.', 'Earn 60–85 Coins / Shift') +
        '<section class="grid grid-3">' + shifts.map(function(s){
          const claimed = state.claimed.indexOf(s[0]) !== -1;
          return '<article class="card"><div style="display:flex;justify-content:space-between"><strong>🕒 Shift Block</strong><span class="status">' + (claimed ? 'FILLED' : 'OPEN') + '</span></div><h3 class="card-title">' + s[1] + '</h3><p class="micro">Hub Location: Center Lingo Hub A</p><div class="actions" style="justify-content:space-between;margin-top:1rem"><strong style="color:var(--amber)">+' + s[2] + ' Coins</strong><button class="btn green" ' + (claimed ? 'disabled' : '') + ' onclick="claimShift(\'' + s[0] + '\',' + s[2] + ')">' + (claimed ? 'Claimed' : 'Join Shift') + '</button></div></article>';
        }).join('') + '</section>';
    }
    function claimShift(id, coins) { if (state.claimed.indexOf(id) === -1) { state.claimed.push(id); state.coins += coins; save(); render(); } }
    function renderPremium() {
      const gigs = [['Deluxe Wash & Fold Batch', 'West Lingo Hub C', 35], ['Doorstep Pickup Shuttle Express', 'Lingo Bridgeton 08302', 50], ['District Route Passenger Shuttle', 'North Lingo to Center Hub A', 40]];
      return hero('Lingo Premium Lane', 'Wash & Fold Gigs, Pickups & Rides', 'Accept premium preview gigs and simulate real-cash earning flows without payment processing.', 'USD Preview Economy') +
        '<section class="grid grid-3">' + gigs.map(function(g){ return '<article class="card"><span class="badge" style="color:var(--pink);border-color:rgba(236,72,153,.35)">PREMIUM</span><h3 class="card-title">' + g[0] + '</h3><p class="micro">Location: ' + g[1] + '</p><div class="actions" style="justify-content:space-between;margin-top:1rem"><strong style="color:var(--green);font-size:1.2rem">$' + g[2].toFixed(2) + '</strong><button class="btn pink" onclick="acceptGig(' + g[2] + ')">Accept Gig</button></div></article>'; }).join('') + '</section>';
    }
    function acceptGig(pay) { state.cash += pay; save(); render(); alert('Gig accepted. $' + pay.toFixed(2) + ' added to preview wallet.'); }
    function renderMarket() {
      return hero('Lingo Market Micro-Store', 'Detergents, Supplies & Gear', 'Buy district supplies with local Coins or preview Cash.', 'In-Stock Dispatch') +
        '<section class="grid grid-4">' + products.map(function(p, i){
          return '<article class="card"><div style="font-size:2rem">' + p[3] + '</div><h3 class="card-title">' + p[0] + '</h3><div class="grid"><button class="btn amber" onclick="buyItem(' + i + ',\'coins\')">Pay ' + p[1] + ' Coins</button><button class="btn green" onclick="buyItem(' + i + ',\'cash\')">Pay $' + p[2].toFixed(2) + '</button></div></article>';
        }).join('') + '</section>';
    }
    function buyItem(i, currency) {
      const p = products[i];
      if (currency === 'coins') { if (state.coins < p[1]) return alert('Insufficient Coins.'); state.coins -= p[1]; }
      else { if (state.cash < p[2]) return alert('Insufficient Cash.'); state.cash -= p[2]; }
      save(); render(); alert('Ordered ' + p[0] + '.');
    }
    function renderLeague() {
      return hero('Lingo League Mini-Games', 'Mama\'s Blessings Slot Machine', 'Spend 10 preview Coins to spin for instant bonus Coins.', 'Static Browser Game') +
        '<section class="card" style="max-width:560px;margin:0 auto;text-align:center"><div class="slot"><div id="r1" class="reel">🎰</div><div id="r2" class="reel">🌟</div><div id="r3" class="reel">👑</div></div><button class="btn amber" style="width:100%" onclick="spin()">SPIN (10 COINS)</button></section>';
    }
    function spin() {
      if (state.coins < 10) return alert('Need at least 10 Coins.');
      state.coins -= 10; save();
      const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
      reels.forEach(function(r){ r.classList.add('spin'); });
      setTimeout(function(){
        const symbols = ['🍒','🎰','🌟','👑','🪙'];
        const vals = reels.map(function(r){ const v = symbols[Math.floor(Math.random()*symbols.length)]; r.textContent = v; r.classList.remove('spin'); return v; });
        if (vals[0] === vals[1] && vals[1] === vals[2]) { state.coins += 100; alert('Jackpot. +100 Coins.'); }
        else if (vals[0] === vals[1] || vals[1] === vals[2] || vals[0] === vals[2]) { state.coins += 20; }
        save(); render();
      }, 700);
    }
    function renderBoard() {
      return hero('District Bulletin Board', 'Lingo Board', 'Post a local update, shoutout, or assistance request. Stored locally for this preview.', state.posts.length + ' Posts') +
        '<section class="card" style="max-width:720px;margin:0 auto 1rem"><textarea id="postText" placeholder="Post a district update..."></textarea><div class="actions" style="margin-top:.75rem"><button class="btn" onclick="publishPost()">Publish Post</button></div></section>' +
        '<section class="feed" style="max-width:720px;margin:0 auto">' + state.posts.map(function(p){ return '<article class="card"><div style="display:flex;justify-content:space-between;gap:1rem"><strong>' + p.user + '</strong><span class="micro">' + new Date(p.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span></div><p class="micro" style="color:var(--sky)">' + (p.role || 'District Citizen') + '</p><p>' + escapeHtml(p.message) + '</p></article>'; }).join('') + '</section>';
    }
    function publishPost() { const el = document.getElementById('postText'); if (!el.value.trim()) return; state.posts.unshift({user:'Devontray H.', role:'District Member', message: el.value.trim(), time: Date.now()}); save(); render(); }
    function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
    function renderFriends() {
      return hero('Neighbor Network', 'Lingo Friends', 'Connect with nearby helpers and tip Coins for good service.', friends.length + ' Connected') +
        '<section class="feed" style="max-width:720px;margin:0 auto">' + friends.map(function(f){ return '<article class="card" style="display:flex;justify-content:space-between;gap:1rem;align-items:center"><div><strong>' + f[0] + '</strong><p class="micro"><span style="color:var(--sky)">' + f[1] + '</span> • ' + f[2] + ' • ' + (f[3] ? 'Online' : 'Offline') + '</p></div><button class="btn ghost" onclick="tipFriend(\'' + f[0] + '\')">Tip 10 Coins</button></article>'; }).join('') + '</section>';
    }
    function tipFriend(name) { if (state.coins < 10) return alert('Need at least 10 Coins.'); state.coins -= 10; save(); render(); alert('Tipped 10 Coins to ' + name + '.'); }
    function render() {
      renderTabs(); updateWallet();
      const app = document.getElementById('app');
      if (state.tab === 'map') app.innerHTML = renderMap();
      if (state.tab === 'community') app.innerHTML = renderCommunity();
      if (state.tab === 'premium') app.innerHTML = renderPremium();
      if (state.tab === 'market') app.innerHTML = renderMarket();
      if (state.tab === 'league') app.innerHTML = renderLeague();
      if (state.tab === 'board') app.innerHTML = renderBoard();
      if (state.tab === 'friends') app.innerHTML = renderFriends();
    }
    render();
  </script>
</body>
</html>
