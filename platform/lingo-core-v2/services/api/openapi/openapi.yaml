openapi: 3.1.0
info:
  title: LINGO CORE V2 Profile API
  version: 0.1.0
  description: Non-production identity-backed profile API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Process liveness
      responses:
        "200":
          description: Process is alive
  /readyz:
    get:
      security: []
      summary: PostgreSQL readiness
      responses:
        "200":
          description: Database is ready
        "503":
          description: Database is unavailable
  /v1/me/profile:
    get:
      summary: Read the authenticated user's profile
      responses:
        "200":
          description: Profile
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Profile does not exist
    put:
      summary: Create or update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "200":
          description: Profile saved and outbox event committed
        "401":
          description: Missing or invalid bearer token
        "422":
          description: Invalid profile data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
