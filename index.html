<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#09090d">
  <meta http-equiv="refresh" content="0;url=/studio-hub/">
  <title>LINGOlegacy — Studio Hub</title>
  <style>
    :root{color-scheme:dark;background:#09090d;color:#fff8ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(181,18,45,.32),transparent 38rem),linear-gradient(180deg,#09090d,#151018)}
    main{width:min(640px,100%);padding:32px;border:1px solid rgba(247,200,75,.28);border-radius:28px;background:rgba(16,16,22,.88);box-shadow:0 24px 90px rgba(0,0,0,.42);text-align:center}
    .mark{font-size:clamp(2.8rem,14vw,5rem);font-weight:1000;letter-spacing:-.09em;color:#f7c84b}
    p{color:#c9b98c;line-height:1.6}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#fff0a0,#f7c84b);color:#170900;font-weight:900;text-decoration:none}
  </style>
  <script>window.location.replace("/studio-hub/");</script>
</head>
<body>
  <main>
    <div class="mark">LINGO</div>
    <h1>Opening the Studio Hub</h1>
    <p>The LINGOlegacy Universe Gateway is now the primary entry point. If your browser does not redirect automatically, use the link below.</p>
    <a href="/studio-hub/">Enter LINGO Studio Hub</a>
  </main>
</body>
</html>
