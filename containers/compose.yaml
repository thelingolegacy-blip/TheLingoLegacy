services:
  lingo-container-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: lingo-legacy-container:local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
