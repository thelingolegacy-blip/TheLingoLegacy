# Isolated flagship preview only.
# Do not attach production domains or change the canonical Worker through this config.
name = "lingo-legacy-flagship-preview"
main = "cloudflare/flagship-root/preview-worker.js"
compatibility_date = "2026-10-29"
workers_dev = true

[vars]
CANONICAL_DOMAIN = "thelingolegacy.com"
PUBLIC_SITE_URL = "https://thelingolegacy.com"

[observability]
enabled = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
