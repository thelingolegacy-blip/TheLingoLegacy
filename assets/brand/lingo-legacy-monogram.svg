<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lingo Legacy monogram concept</title>
  <desc id="desc">A geometric gold L inside a graphite circular crest with restrained violet and cyan light accents.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".42" stop-color="#f7c84b"/>
      <stop offset="1" stop-color="#a87520"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343541"/>
      <stop offset=".55" stop-color="#111219"/>
      <stop offset="1" stop-color="#292b37"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="226" fill="#050507" stroke="#4b4d59" stroke-width="3"/>
  <circle cx="256" cy="256" r="207" fill="url(#metal)" stroke="#f7c84b" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#56efff" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M256 75 278 113 321 106 326 150 365 169 347 208 373 242 340 270 346 314 302 322 281 361 242 344 205 367 181 330 137 329 137 285 99 263 120 225 101 186 142 165 151 121 195 126 221 90Z" fill="none" stroke="#6b2dff" stroke-opacity=".48" stroke-width="2"/>
  <path d="M195 154H251V293H337V348H195Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M176 375H336" stroke="#f7c84b" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <circle cx="256" cy="256" r="4" fill="#56efff"/>
</svg>
