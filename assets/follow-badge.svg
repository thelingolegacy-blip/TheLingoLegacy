<svg xmlns="http://www.w3.org/2000/svg" width="448" height="96" viewBox="0 0 448 96" role="img" aria-labelledby="title desc">
  <title id="title">Follow The Lingo Legacy</title>
  <desc id="desc">Gold and purple local follow badge for The Lingo Legacy GitHub profile.</desc>
  <defs>
    <linearGradient id="badge-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b165f"/>
      <stop offset="0.48" stop-color="#5b2387"/>
      <stop offset="1" stop-color="#0b0618"/>
    </linearGradient>
    <linearGradient id="badge-gold" x1="0" x2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.5" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#b66a13"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ffcf5a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="448" height="96" rx="48" fill="url(#badge-bg)"/>
  <rect x="2" y="2" width="444" height="92" rx="46" fill="none" stroke="url(#badge-gold)" stroke-width="4"/>
  <circle cx="52" cy="48" r="25" fill="url(#badge-gold)" filter="url(#glow)"/>
  <path d="M52 24l7.2 14.6 16.1 2.3-11.6 11.3 2.7 16-14.4-7.6-14.4 7.6 2.7-16-11.6-11.3 16.1-2.3L52 24z" fill="#160900"/>
  <text x="92" y="40" fill="#fff8df" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing=".08em">FOLLOW</text>
  <text x="92" y="66" fill="#ffcf5a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">The Lingo Legacy</text>
  <text x="360" y="56" fill="#fff8df" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">GitHub</text>
</svg>
