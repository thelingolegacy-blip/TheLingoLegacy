AWSTemplateFormatVersion: "2010-09-09"
Description: "LINGOsonic Nexus isolated sidecar baseline. Review costs and IAM before deployment."

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,10}$"
    Description: Isolated API stage name.

Resources:
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "lingosonic-${StageName}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "lingosonic-${StageName}-jobs"
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 4

  JobStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "lingosonic-${StageName}-job-status"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lingosonic-${StageName}-job-intake"
      RetentionInDays: 30

  JobIntakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "lingosonic-${StageName}-job-intake-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: queue-and-status-minimum
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt JobsQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt JobStatusTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lingosonic-${StageName}-job-intake:*"

  JobIntakeFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "lingosonic-${StageName}-job-intake"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt JobIntakeRole.Arn
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          QUEUE_URL: !Ref JobsQueue
          TABLE_NAME: !Ref JobStatusTable
      Code:
        ZipFile: |
          import json, os, uuid
          from datetime import datetime, timezone
          import boto3
          sqs = boto3.client("sqs")
          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          def reply(status, body):
              return {"statusCode": status, "headers": {"content-type": "application/json", "cache-control": "no-store"}, "body": json.dumps(body)}
          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "")
              path = event.get("rawPath", "/")
              if method == "GET" and path.endswith("/health"):
                  return reply(200, {"status": "ok", "service": "lingosonic-sidecar"})
              if method != "POST" or not path.endswith("/jobs"):
                  return reply(404, {"error": "not_found"})
              try:
                  if event.get("isBase64Encoded"):
                      return reply(400, {"error": "base64_body_not_supported"})
                  payload = json.loads(event.get("body") or "{}")
              except (TypeError, json.JSONDecodeError):
                  return reply(400, {"error": "invalid_json"})
              if not isinstance(payload, dict):
                  return reply(400, {"error": "json_object_required"})
              task = payload.get("task")
              if not isinstance(task, str) or not task.strip() or len(task) > 120:
                  return reply(400, {"error": "task_must_be_1_to_120_characters"})
              job_id = str(uuid.uuid4())
              created_at = datetime.now(timezone.utc).isoformat()
              record = {"jobId": job_id, "status": "QUEUED", "task": task.strip(), "createdAt": created_at}
              try:
                  table.put_item(Item=record, ConditionExpression="attribute_not_exists(jobId)")
                  sqs.send_message(QueueUrl=os.environ["QUEUE_URL"], MessageBody=json.dumps({"jobId": job_id, "task": task.strip()}), MessageAttributes={"schema": {"DataType": "String", "StringValue": "lingo.job.v1"}})
              except Exception:
                  print(json.dumps({"event": "job_enqueue_failed", "jobId": job_id}))
                  return reply(503, {"error": "job_enqueue_unavailable", "jobId": job_id})
              print(json.dumps({"event": "job_queued", "jobId": job_id, "requestId": getattr(context, "aws_request_id", None)}))
              return reply(202, {"jobId": job_id, "status": "QUEUED", "createdAt": created_at})

  SidecarApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "lingosonic-${StageName}-api"
      ProtocolType: HTTP
      Description: "IAM-authorized API for isolated LINGOsonic sidecar"

  JobIntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SidecarApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt JobIntakeFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  JobsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SidecarApi
      RouteKey: "POST /jobs"
      AuthorizationType: AWS_IAM
      Target: !Sub "integrations/${JobIntakeIntegration}"

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SidecarApi
      RouteKey: "GET /health"
      AuthorizationType: AWS_IAM
      Target: !Sub "integrations/${JobIntakeIntegration}"

  SidecarStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - JobsRoute
      - HealthRoute
    Properties:
      ApiId: !Ref SidecarApi
      StageName: !Ref StageName
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobIntakeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SidecarApi}/*/*"

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "lingosonic-${StageName}-lambda-errors"
      AlarmDescription: "Alert on Lambda intake errors; add an SNS notification target before production."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobIntakeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: IAM-authorized API base URL. Do not expose credentials in the browser.
    Value: !Sub "https://${SidecarApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  JobsQueueUrl:
    Value: !Ref JobsQueue
  JobStatusTableName:
    Value: !Ref JobStatusTable
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
